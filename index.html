<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RoadPilot GPS</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#0f172a}body{min-height:100dvh;display:grid;place-items:center;padding:20px;overflow:hidden}.phone{width:390px;height:min(800px,calc(100dvh - 40px));background:#080b10;border-radius:44px;padding:10px;box-shadow:0 30px 80px #0008;position:relative}.phone:before{content:"";position:absolute;width:115px;height:26px;background:#080b10;border-radius:20px;top:16px;left:50%;transform:translateX(-50%);z-index:1500}.screen{height:100%;border-radius:36px;overflow:hidden;position:relative;background:#fff}#map{position:absolute;inset:0;z-index:1}.top{position:absolute;z-index:1400;top:54px;left:12px;right:12px;display:flex;gap:8px}.searchwrap{flex:1;position:relative}.search{background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 6px 18px #0003;display:flex;gap:6px;align-items:center}.search input{border:0;outline:0;min-width:0;flex:1;font-size:14px}.btn{border:0;border-radius:12px;padding:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.gps{width:48px;background:#fff;color:#111}.suggestions{position:absolute;top:52px;left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 12px 28px #0005;display:none;overflow:hidden;max-height:250px;z-index:1700}.suggestion{padding:11px 12px;border-bottom:1px solid #e5e7eb}.suggestion b{display:block;font-size:13px}.suggestion span{display:block;font-size:11px;color:#64748b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.navbar{position:absolute;z-index:1450;top:112px;left:12px;right:12px;background:#111827;color:#fff;border-radius:16px;padding:12px;display:none;box-shadow:0 6px 18px #0004}.navrow{display:flex;justify-content:space-between;gap:10px;align-items:center}.navmain{font-weight:800;font-size:15px}.navsub{font-size:11px;color:#cbd5e1;margin-top:3px}.mode{position:absolute;z-index:1460;top:72px;left:12px;background:#111827;color:#fff;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800;display:none}.controls{position:absolute;z-index:1350;right:12px;bottom:255px;display:grid;gap:8px}.controls button{width:46px;height:46px;border:0;border-radius:14px;background:#fff;box-shadow:0 6px 18px #0003;font-size:20px}.card{position:absolute;z-index:1450;left:12px;right:12px;bottom:78px;background:#fffffff3;border-radius:22px;padding:12px;box-shadow:0 12px 30px #0004}.card h3{margin:0 0 4px;font-size:18px}.card p{margin:0;color:#64748b;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.stat{background:#f1f5f9;border-radius:12px;padding:7px;text-align:center}.stat b{display:block}.stat span{font-size:9px;color:#64748b}.start{position:absolute;z-index:1500;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));width:calc(100% - 24px);min-height:52px;font-size:16px;box-shadow:0 8px 20px #0004}.toast{position:absolute;z-index:1800;top:170px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 12px;border-radius:10px;font-size:12px;display:none}.car{font-size:34px;filter:drop-shadow(0 5px 6px #0009)}#driverScene{position:absolute;inset:0;z-index:1200;display:none;overflow:hidden;background:linear-gradient(#85c8ff 0 30%,#b7d993 30% 100%)}.horizon{position:absolute;left:0;right:0;top:29%;height:2px;background:#d8eef8}.sceneSign{position:absolute;z-index:3;top:34%;left:50%;transform:translateX(-50%);background:#166534;color:#fff;border:3px solid #fff;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:800;box-shadow:0 4px 8px #0005;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.roadSvg{position:absolute;inset:0;width:100%;height:100%}.sceneCar{position:absolute;z-index:4;left:50%;bottom:205px;transform:translateX(-50%);font-size:54px;filter:drop-shadow(0 8px 8px #0008)}.sceneDash{position:absolute;z-index:3;bottom:176px;left:50%;transform:translateX(-50%);background:#111827dd;color:#fff;border-radius:16px;padding:8px 14px;font-size:12px;font-weight:800}.maplibregl-ctrl-attrib{font-size:8px!important}@media(max-width:500px){body{padding:0;display:block}.phone{width:100vw;height:100svh;border-radius:0;padding:0;box-shadow:none}.phone:before{display:none}.screen{border-radius:0}.top{top:max(12px,env(safe-area-inset-top))}.navbar{top:72px}.mode{top:64px}.card{left:10px;right:10px;bottom:76px;padding:10px}.controls{right:10px;bottom:245px}.start{left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));width:calc(100% - 20px)}.sceneCar{bottom:210px}}</style></head><body><div class="phone"><div class="screen"><div id="map"></div><div id="driverScene"><div class="horizon"></div><div id="sceneSign" class="sceneSign">Road ahead</div><svg class="roadSvg" viewBox="0 0 390 800" preserveAspectRatio="none"><path id="roadOuter" d="M35 800 Q195 620 183 235 L207 235 Q195 620 355 800 Z" fill="#e5e7eb"/><path id="roadInner" d="M58 800 Q195 620 187 235 L203 235 Q195 620 332 800 Z" fill="#24272b"/><path id="laneLeft" d="M112 800 Q195 620 190 235" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="22 20"/><path id="laneCenter" d="M195 800 Q195 620 195 235" fill="none" stroke="#ffd84d" stroke-width="5" stroke-dasharray="24 22"/><path id="laneRight" d="M278 800 Q195 620 200 235" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="22 20"/></svg><div class="sceneCar">🚗</div><div id="sceneDash" class="sceneDash">Following route</div></div><div class="top"><div class="searchwrap"><div class="search"><span>🔎</span><input id="destination" autocomplete="off" placeholder="Enter destination"><button class="btn" id="routeBtn">Route</button></div><div id="suggestions" class="suggestions"></div></div><button class="btn gps" id="gpsBtn">📍</button></div><div id="mode" class="mode">🚗 DRIVER EYE MODE</div><div id="navbar" class="navbar"><div class="navrow"><div><div id="navMain" class="navmain">Navigation started</div><div id="navSub" class="navsub">Waiting for GPS…</div></div><div id="speed">0 mph</div></div></div><div class="controls"><button id="zoomIn">+</button><button id="zoomOut">−</button><button id="recenter">◎</button></div><div class="card"><h3 id="title">Choose a destination</h3><p id="subtitle">Type an address or use GPS.</p><div class="stats"><div class="stat"><b id="distance">—</b><span>DISTANCE</span></div><div class="stat"><b id="duration">—</b><span>TIME</span></div><div class="stat"><b id="eta">—</b><span>ETA</span></div></div></div><button class="btn start" id="startBtn">Start Navigation</button><div class="toast" id="toast"></div></div></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>const DEFAULT=[-122.1215,47.674],$=id=>document.getElementById(id);const map=new maplibregl.Map({container:'map',center:DEFAULT,zoom:12,style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap'}},layers:[{id:'osm',type:'raster',source:'osm'}]}});let userLoc=[47.674,-122.1215],destinationPoint=null,currentRoute=null,watchId=null,navigating=false,destMarker=null,carMarker=null,selectedSuggestion=null,searchTimer=null;function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}function ensureCar(){if(carMarker)return;const el=document.createElement('div');el.className='car';el.textContent='🚗';carMarker=new maplibregl.Marker({element:el}).setLngLat([userLoc[1],userLoc[0]]).addTo(map)}function setUser(lat,lon,zoom=true){userLoc=[lat,lon];ensureCar();carMarker.setLngLat([lon,lat]);if(zoom&&!navigating)map.easeTo({center:[lon,lat],zoom:15,duration:500})}function fmtAddr(tags,lat,lon){const line1=[tags['addr:housenumber'],tags['addr:street']].filter(Boolean).join(' '),line2=[tags['addr:city']||tags['addr:place']||tags['addr:suburb'],tags['addr:state'],tags['addr:postcode']].filter(Boolean).join(', ');return{lat,lon,line1:line1||tags.name||'Address',line2,name:[line1,line2].filter(Boolean).join(', ')}}async function houseNumberSearch(q){const data=`[out:json][timeout:8];(nwr(around:25000,${userLoc[0]},${userLoc[1]})[\"addr:housenumber\"=\"${q}\"];);out center tags 25;`;const u='https://overpass-api.de/api/interpreter?data='+encodeURIComponent(data);const d=await fetch(u).then(r=>r.json());return(d.elements||[]).map(e=>{const lat=e.lat??e.center?.lat,lon=e.lon??e.center?.lon;return lat&&lon?fmtAddr(e.tags||{},lat,lon):null}).filter(x=>x&&x.line1.includes(q))}function formatPhoton(f){const p=f.properties||{},line1=[p.housenumber,p.street||p.name].filter(Boolean).join(' ').trim(),line2=[p.city||p.town||p.village,p.state,p.postcode].filter(Boolean).join(', ');return{lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],line1:line1||p.name||'Address',line2,name:[line1,line2].filter(Boolean).join(', ')}}async function photonSearch(q){const u=`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=7&lat=${userLoc[0]}&lon=${userLoc[1]}&lang=en`;const d=await fetch(u).then(r=>r.json());return(d.features||[]).map(formatPhoton).filter(x=>x.name)}async function autocomplete(q){if(q.length<2){$('suggestions').style.display='none';return}try{let items=[];if(/^\d{3,6}$/.test(q))items=await houseNumberSearch(q);if(items.length<3){const more=await photonSearch(q);const seen=new Set(items.map(x=>x.name));for(const x of more)if(!seen.has(x.name))items.push(x)}renderSuggestions(items.slice(0,7))}catch(e){try{renderSuggestions((await photonSearch(q)).slice(0,7))}catch(_){$('suggestions').style.display='none'}}}function renderSuggestions(items){const box=$('suggestions');box.innerHTML='';if(!items.length){box.innerHTML='<div class="suggestion"><b>No exact nearby address yet</b><span>Keep typing the street name</span></div>';box.style.display='block';return}items.forEach(x=>{const d=document.createElement('div');d.className='suggestion';d.innerHTML=`<b>${x.line1}</b><span>${x.line2||x.name}</span>`;d.onclick=()=>{selectedSuggestion=x;$('destination').value=x.name;box.style.display='none'};box.appendChild(d)});box.style.display='block'}async function geocode(q){const u='https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&countrycodes=us&q='+encodeURIComponent(q);const d=await fetch(u).then(r=>r.json());if(!d.length)throw Error('Destination not found');return{lat:+d[0].lat,lon:+d[0].lon,name:d[0].display_name}}async function getRoute(start,end){const u=`https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson&steps=true`;const d=await fetch(u).then(r=>r.json());if(!d.routes?.length)throw Error('No route found');return d.routes[0]}const miles=m=>(m/1609.344).toFixed(m<16093?1:0)+' mi',mins=s=>{const m=Math.round(s/60);return m<60?m+' min':Math.floor(m/60)+'h '+m%60+'m'},eta=s=>new Date(Date.now()+s*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});function drawRoad(route){const data={type:'Feature',geometry:route.geometry,properties:{}};if(map.getSource('route'))map.getSource('route').setData(data);else{map.addSource('route',{type:'geojson',data});map.addLayer({id:'edge',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#f5f5f5','line-width':30}});map.addLayer({id:'road',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#202428','line-width':24}});map.addLayer({id:'center',type:'line',source:'route',paint:{'line-color':'#ffd84d','line-width':3,'line-dasharray':[2,2]}})}}function fitRoute(route){const c=route.geometry.coordinates,b=c.reduce((bb,p)=>bb.extend(p),new maplibregl.LngLatBounds(c[0],c[0]));map.fitBounds(b,{padding:{top:130,bottom:270,left:45,right:45},maxZoom:16,duration:600})}function nextStep(r){const s=r?.legs?.[0]?.steps||[];return s.find(x=>x.maneuver?.type!=='depart')||s[0]}function navInstruction(r){const s=nextStep(r);if(!s)return'Continue';const m=s.maneuver||{},name=s.name?' onto '+s.name:'';if(m.type==='turn')return'Turn '+(m.modifier||'')+name;if(m.type==='merge')return'Merge '+(m.modifier||'')+name;if(m.type==='roundabout')return'Enter roundabout'+name;if(m.type==='arrive')return'You have arrived';return'Continue'+name}function updateDriverScene(r){const s=nextStep(r),mod=s?.maneuver?.modifier||'',road=s?.name||'Road ahead';$('sceneSign').textContent=road;$('sceneDash').textContent=navInstruction(r);let outer='M35 800 Q195 620 183 235 L207 235 Q195 620 355 800 Z',inner='M58 800 Q195 620 187 235 L203 235 Q195 620 332 800 Z',left='M112 800 Q195 620 190 235',center='M195 800 Q195 620 195 235',right='M278 800 Q195 620 200 235';if(mod.includes('left')){outer='M20 800 Q330 610 160 235 L188 235 Q342 605 370 800 Z';inner='M48 800 Q320 610 165 235 L184 235 Q327 605 342 800 Z';left='M108 800 Q292 610 169 235';center='M195 800 Q310 610 176 235';right='M282 800 Q330 610 183 235'}else if(mod.includes('right')){outer='M20 800 Q48 605 202 235 L230 235 Q60 610 370 800 Z';inner='M48 800 Q63 605 206 235 L225 235 Q70 610 342 800 Z';left='M108 800 Q60 610 207 235';center='M195 800 Q80 610 214 235';right='M282 800 Q98 610 221 235'}$('roadOuter').setAttribute('d',outer);$('roadInner').setAttribute('d',inner);$('laneLeft').setAttribute('d',left);$('laneCenter').setAttribute('d',center);$('laneRight').setAttribute('d',right)}async function buildRoute(){const q=$('destination').value.trim();if(!q)return toast('Enter a destination');$('suggestions').style.display='none';$('title').textContent='Finding route...';try{const p=selectedSuggestion&&$('destination').value===selectedSuggestion.name?selectedSuggestion:await geocode(q);destinationPoint=[p.lat,p.lon];currentRoute=await getRoute(userLoc,destinationPoint);if(destMarker)destMarker.remove();destMarker=new maplibregl.Marker({color:'#dc2626'}).setLngLat([p.lon,p.lat]).addTo(map);drawRoad(currentRoute);fitRoute(currentRoute);$('title').textContent=p.line1||p.name.split(',')[0]||q;$('subtitle').textContent=p.name;$('distance').textContent=miles(currentRoute.distance);$('duration').textContent=mins(currentRoute.duration);$('eta').textContent=eta(currentRoute.duration);updateDriverScene(currentRoute);toast('Route ready')}catch(e){$('title').textContent='Route unavailable';$('subtitle').textContent=e.message;toast(e.message)}}function hav(a,b){const R=6371000,r=x=>x*Math.PI/180,dlat=r(b[0]-a[0]),dlon=r(b[1]-a[1]),x=Math.sin(dlat/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}async function refreshRoute(){if(!destinationPoint)return;try{currentRoute=await getRoute(userLoc,destinationPoint);drawRoad(currentRoute);$('distance').textContent=miles(currentRoute.distance);$('duration').textContent=mins(currentRoute.duration);$('eta').textContent=eta(currentRoute.duration);$('navMain').textContent=navInstruction(currentRoute);$('navSub').textContent=`${miles(currentRoute.distance)} remaining • ${mins(currentRoute.duration)}`;updateDriverScene(currentRoute)}catch(e){$('navSub').textContent='Recalculating…'}}function startNavigation(){if(!currentRoute||!destinationPoint)return toast('Build a route first');if(!navigator.geolocation)return toast('GPS not supported');navigating=true;$('driverScene').style.display='block';$('mode').style.display='block';$('navbar').style.display='block';$('top').style.display='none';$('controls').style.display='none';$('startBtn').textContent='Stop Navigation';$('navMain').textContent=navInstruction(currentRoute);$('navSub').textContent=`${miles(currentRoute.distance)} remaining • ${mins(currentRoute.duration)}`;updateDriverScene(currentRoute);let last=0;watchId=navigator.geolocation.watchPosition(async p=>{setUser(p.coords.latitude,p.coords.longitude,false);$('speed').textContent=Math.max(0,Math.round((p.coords.speed||0)*2.237))+' mph';if(hav(userLoc,destinationPoint)<35){$('navMain').textContent='You have arrived';$('sceneDash').textContent='Destination reached';return}if(Date.now()-last>7000){last=Date.now();await refreshRoute()}},()=>toast('Allow precise location for navigation'),{enableHighAccuracy:true,maximumAge:1000,timeout:15000});toast('Driver Eye started')}function stopNavigation(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;navigating=false;$('driverScene').style.display='none';$('mode').style.display='none';$('navbar').style.display='none';$('top').style.display='flex';$('controls').style.display='grid';$('startBtn').textContent='Start Navigation';toast('Navigation stopped')}$('gpsBtn').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{setUser(p.coords.latitude,p.coords.longitude,true);toast('GPS updated')},()=>toast('Allow location permission'),{enableHighAccuracy:true,timeout:10000}):toast('GPS not supported');$('routeBtn').onclick=buildRoute;$('destination').addEventListener('input',e=>{selectedSuggestion=null;clearTimeout(searchTimer);searchTimer=setTimeout(()=>autocomplete(e.target.value.trim()),350)});$('destination').addEventListener('keydown',e=>e.key==='Enter'&&buildRoute());$('zoomIn').onclick=()=>map.zoomIn();$('zoomOut').onclick=()=>map.zoomOut();$('recenter').onclick=()=>map.easeTo({center:[userLoc[1],userLoc[0]],zoom:15,duration:400});$('startBtn').onclick=()=>navigating?stopNavigation():startNavigation();map.on('load',ensureCar);</script></body></html>
