<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RoadPilot GPS</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#0f172a}body{min-height:100dvh;display:grid;place-items:center;padding:20px;overflow:hidden}.phone{width:390px;height:min(800px,calc(100dvh - 40px));background:#080b10;border-radius:44px;padding:10px;box-shadow:0 30px 80px #0008;position:relative}.screen{height:100%;border-radius:36px;overflow:hidden;position:relative;background:#fff}#map{position:absolute;inset:0;z-index:1}.top{position:absolute;z-index:2100;top:54px;left:12px;right:12px;display:flex;gap:8px}.searchwrap{flex:1;position:relative}.search{background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 6px 18px #0003;display:flex;gap:6px;align-items:center}.search input{border:0;outline:0;min-width:0;flex:1;font-size:14px}.btn{border:0;border-radius:12px;padding:10px;background:#2563eb;color:#fff;font-weight:800;touch-action:manipulation}.gps{width:48px;background:#fff;color:#111}.suggestions{position:absolute;top:52px;left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 12px 28px #0005;display:none;overflow:auto;max-height:250px;z-index:2600}.suggestion{padding:11px 12px;border-bottom:1px solid #e5e7eb}.suggestion b{display:block;font-size:13px}.suggestion span{display:block;font-size:11px;color:#64748b;margin-top:2px}.navbar{position:absolute;z-index:2300;top:70px;left:10px;right:10px;background:#101827e8;color:#fff;border-radius:18px;padding:13px 14px;display:none}.navrow{display:flex;justify-content:space-between;gap:12px;align-items:center}.navmain{font-weight:900;font-size:18px}.navsub{font-size:12px;color:#d7deea;margin-top:5px}.speedbox{font-size:22px;font-weight:900}.mode{position:absolute;z-index:2310;top:152px;right:12px;background:#0b1219e8;color:#7CFC5D;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:900;display:none}.card{position:absolute;z-index:2200;left:12px;right:12px;bottom:78px;background:#fffffff3;border-radius:22px;padding:12px}.card h3{margin:0 0 4px;font-size:18px}.card p{margin:0;color:#64748b;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.stat{background:#f1f5f9;border-radius:12px;padding:7px;text-align:center}.stat b{display:block}.stat span{font-size:9px;color:#64748b}.start{position:absolute;z-index:2800;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));width:calc(100% - 24px);min-height:58px;font-size:17px;box-shadow:0 8px 20px #0004}.toast{position:absolute;z-index:3000;top:170px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 12px;border-radius:10px;font-size:12px;display:none}#driverScene{position:absolute;inset:0;z-index:2000;display:none;background:linear-gradient(#72c7ff 0 35%,#96c779 35% 100%);overflow:hidden}.road{position:absolute;left:50%;bottom:-12%;transform:translateX(-50%);width:105%;height:82%;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);background:linear-gradient(90deg,#ddd 0 3%,#282b2f 3% 97%,#ddd 97%)}.road:after{content:"";position:absolute;left:49%;top:0;width:2%;height:100%;background:repeating-linear-gradient(#ffd84d 0 22px,transparent 22px 45px)}.routeRibbon{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 4px 4px #0008)}.hood{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);width:62%;height:88px;border-radius:60% 60% 10% 10%;background:linear-gradient(#56616e,#111820)}.driverInfo{position:absolute;left:12px;right:12px;bottom:120px;z-index:2250;background:#10161eea;color:#fff;border-radius:17px;padding:10px 13px;display:none}.driverInfo b{display:block;font-size:14px}.driverInfo span{font-size:11px;color:#cbd5e1}body.nav-active .top,body.nav-active .card{display:none}body.nav-active .navbar,body.nav-active .mode,body.nav-active #driverScene,body.nav-active .driverInfo{display:block}@media(max-width:500px){body{padding:0;display:block}.phone{width:100vw;height:100svh;border-radius:0;padding:0}.screen{border-radius:0}.top{top:max(12px,env(safe-area-inset-top))}.navbar{top:max(12px,env(safe-area-inset-top))}.mode{top:112px}.start{left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));width:calc(100% - 20px)}}</style></head><body><div class="phone"><div class="screen"><div id="map"></div><div id="driverScene"><div class="road"></div><svg class="routeRibbon" viewBox="0 0 390 800" preserveAspectRatio="none"><path id="routeGlow" d="M195 735 C195 610 195 520 195 420 C195 350 220 305 268 260" fill="none" stroke="#8bb2ff" stroke-width="26" opacity=".55"/><path id="routeBlue" d="M195 735 C195 610 195 520 195 420 C195 350 220 305 268 260" fill="none" stroke="#1455ff" stroke-width="15"/><polygon id="routeArrow" points="265,247 286,258 268,273" fill="white"/></svg><div class="hood"></div></div><div class="top"><div class="searchwrap"><div class="search"><span>🔎</span><input id="destination" autocomplete="off" placeholder="Enter destination"><button class="btn" id="routeBtn">Route</button></div><div id="suggestions" class="suggestions"></div></div><button class="btn gps" id="gpsBtn">📍</button></div><div id="navbar" class="navbar"><div class="navrow"><div><div id="navMain" class="navmain">Continue</div><div id="navSub" class="navsub">Navigation active</div></div><div id="speed" class="speedbox">0 mph</div></div></div><div class="mode">🚗 DRIVER EYE</div><div class="card"><h3 id="title">Choose a destination</h3><p id="subtitle">Type an address or use GPS.</p><div class="stats"><div class="stat"><b id="distance">—</b><span>DISTANCE</span></div><div class="stat"><b id="duration">—</b><span>TIME</span></div><div class="stat"><b id="eta">—</b><span>ETA</span></div></div></div><div class="driverInfo"><b id="driverDest">Destination</b><span id="driverRemain">GPS connecting…</span></div><button type="button" class="btn start" id="startBtn">Start Navigation</button><div class="toast" id="toast"></div></div></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>const DEFAULT=[-122.1215,47.674],$=id=>document.getElementById(id);const map=new maplibregl.Map({container:'map',center:DEFAULT,zoom:12,style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap'}},layers:[{id:'osm',type:'raster',source:'osm'}]}});let userLoc=[47.674,-122.1215],destinationPoint=null,currentRoute=null,watchId=null,navigating=false,destMarker=null,selectedSuggestion=null,searchTimer=null;function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}async function geocode(q){const d=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q='+encodeURIComponent(q)).then(r=>r.json());if(!d.length)throw Error('Destination not found');return{lat:+d[0].lat,lon:+d[0].lon,name:d[0].display_name}}async function photon(q){const d=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=6&lat=${userLoc[0]}&lon=${userLoc[1]}&lang=en`).then(r=>r.json());return(d.features||[]).map(f=>{const p=f.properties||{},a=[p.housenumber,p.street||p.name].filter(Boolean).join(' '),b=[p.city||p.town||p.village,p.state,p.postcode].filter(Boolean).join(', ');return{lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],name:[a,b].filter(Boolean).join(', '),line1:a||p.name||'Address',line2:b}})}function renderSuggestions(items){const box=$('suggestions');box.innerHTML='';items.forEach(x=>{const d=document.createElement('div');d.className='suggestion';d.innerHTML=`<b>${x.line1}</b><span>${x.line2}</span>`;d.onclick=()=>{selectedSuggestion=x;$('destination').value=x.name;box.style.display='none'};box.appendChild(d)});box.style.display=items.length?'block':'none'}async function getRoute(s,e){const d=await fetch(`https://router.project-osrm.org/route/v1/driving/${s[1]},${s[0]};${e[1]},${e[0]}?overview=full&geometries=geojson&steps=true`).then(r=>r.json());if(!d.routes?.length)throw Error('No route found');return d.routes[0]}const miles=m=>(m/1609.344).toFixed(1)+' mi',mins=s=>Math.max(1,Math.round(s/60))+' min',eta=s=>new Date(Date.now()+s*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});function drawRoad(r){const data={type:'Feature',geometry:r.geometry,properties:{}};if(map.getSource('route'))map.getSource('route').setData(data);else{map.addSource('route',{type:'geojson',data});map.addLayer({id:'edge',type:'line',source:'route',paint:{'line-color':'#fff','line-width':30}});map.addLayer({id:'roadline',type:'line',source:'route',paint:{'line-color':'#222','line-width':24}})}}function nextStep(){const s=currentRoute?.legs?.[0]?.steps||[];return s.find(x=>x.maneuver?.type!=='depart')||s[0]}function instruction(){const s=nextStep();if(!s)return'Continue';const m=s.maneuver||{},n=s.name?' onto '+s.name:'';return m.type==='turn'?'Turn '+(m.modifier||'')+n:m.type==='roundabout'?'Enter roundabout'+n:'Continue'+n}function updateRibbon(){const mod=(nextStep()?.maneuver?.modifier||'').toLowerCase();let d='M195 735 C195 610 195 520 195 420 C195 350 195 305 195 260',p='185,247 205,258 187,273';if(mod.includes('right')){d='M195 735 C195 610 195 510 195 420 C195 345 220 300 268 260';p='260,247 282,258 264,273'}else if(mod.includes('left')){d='M195 735 C195 610 195 510 195 420 C195 345 170 300 122 260';p='130,247 108,258 126,273'}$('routeGlow').setAttribute('d',d);$('routeBlue').setAttribute('d',d);$('routeArrow').setAttribute('points',p)}async function buildRoute(){const q=$('destination').value.trim();if(!q)return toast('Enter a destination');$('suggestions').style.display='none';try{const p=selectedSuggestion&&$('destination').value===selectedSuggestion.name?selectedSuggestion:await geocode(q);destinationPoint=[p.lat,p.lon];currentRoute=await getRoute(userLoc,destinationPoint);drawRoad(currentRoute);const c=currentRoute.geometry.coordinates,b=c.reduce((bb,x)=>bb.extend(x),new maplibregl.LngLatBounds(c[0],c[0]));map.fitBounds(b,{padding:80,maxZoom:16});$('title').textContent=p.name.split(',')[0];$('subtitle').textContent=p.name;$('distance').textContent=miles(currentRoute.distance);$('duration').textContent=mins(currentRoute.duration);$('eta').textContent=eta(currentRoute.duration);$('driverDest').textContent=p.name.split(',').slice(0,2).join(', ');toast('Route ready')}catch(e){toast(e.message)}}async function refresh(){try{currentRoute=await getRoute(userLoc,destinationPoint);$('navMain').textContent=instruction();$('navSub').textContent=`${miles(currentRoute.distance)} remaining • ${mins(currentRoute.duration)}`;$('driverRemain').textContent=`${miles(currentRoute.distance)} remaining • ETA ${eta(currentRoute.duration)}`;updateRibbon()}catch(e){$('navSub').textContent='Route active • GPS reconnecting'}}function startNavigation(){if(!currentRoute||!destinationPoint){toast('Build a route first');return}navigating=true;document.body.classList.add('nav-active');$('startBtn').textContent='End Trip';$('navMain').textContent=instruction();$('navSub').textContent=`${miles(currentRoute.distance)} remaining • ${mins(currentRoute.duration)}`;$('driverRemain').textContent=`${miles(currentRoute.distance)} remaining • ETA ${eta(currentRoute.duration)}`;updateRibbon();toast('Driver Eye started');if(!navigator.geolocation){$('navSub').textContent='Navigation active • GPS unavailable';return}let last=0;try{watchId=navigator.geolocation.watchPosition(async p=>{userLoc=[p.coords.latitude,p.coords.longitude];$('speed').textContent=Math.max(0,Math.round((p.coords.speed||0)*2.237))+' mph';if(Date.now()-last>7000){last=Date.now();await refresh()}},err=>{$('navSub').textContent='Navigation active • tap 📍 to allow GPS';toast('Navigation started — GPS permission needed')},{enableHighAccuracy:true,maximumAge:2000,timeout:20000})}catch(e){$('navSub').textContent='Navigation active • GPS permission needed'}}function stopNavigation(){if(watchId!==null&&navigator.geolocation)navigator.geolocation.clearWatch(watchId);watchId=null;navigating=false;document.body.classList.remove('nav-active');$('startBtn').textContent='Start Navigation';toast('Trip ended')}$('routeBtn').addEventListener('click',buildRoute);$('gpsBtn').addEventListener('click',()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{userLoc=[p.coords.latitude,p.coords.longitude];map.easeTo({center:[p.coords.longitude,p.coords.latitude],zoom:15});toast('GPS updated')},()=>toast('Please allow location in Safari'),{enableHighAccuracy:true}):toast('GPS unavailable'));$('destination').addEventListener('input',e=>{selectedSuggestion=null;clearTimeout(searchTimer);searchTimer=setTimeout(async()=>{try{renderSuggestions(await photon(e.target.value.trim()))}catch(_){renderSuggestions([])}},400)});$('destination').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();buildRoute()}});$('startBtn').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(navigating)stopNavigation();else startNavigation()});$('startBtn').addEventListener('touchend',e=>{e.preventDefault();if(navigating)stopNavigation();else startNavigation()},{passive:false});</script></body></html>
