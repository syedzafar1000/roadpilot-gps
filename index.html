<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RoadPilot GPS</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#0f172a}body{min-height:100dvh;display:grid;place-items:center;padding:20px;overflow:hidden}.phone{width:390px;height:min(800px,calc(100dvh - 40px));background:#080b10;border-radius:44px;padding:10px;box-shadow:0 30px 80px #0008;position:relative}.screen{height:100%;border-radius:36px;overflow:hidden;position:relative;background:#fff}#map{position:absolute;inset:0;z-index:1}.top{position:absolute;z-index:2100;top:54px;left:12px;right:12px;display:flex;gap:8px}.searchwrap{flex:1;position:relative}.search{background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 6px 18px #0003;display:flex;gap:6px;align-items:center}.search input{border:0;outline:0;min-width:0;flex:1;font-size:14px}.btn{border:0;border-radius:12px;padding:10px;background:#2563eb;color:#fff;font-weight:800}.gps{width:48px;background:#fff;color:#111}.suggestions{position:absolute;top:52px;left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 12px 28px #0005;display:none;overflow:auto;max-height:250px;z-index:2600}.suggestion{padding:11px 12px;border-bottom:1px solid #e5e7eb}.suggestion b{display:block;font-size:13px}.suggestion span{display:block;font-size:11px;color:#64748b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.navbar{position:absolute;z-index:2300;top:70px;left:10px;right:10px;background:#101827e8;color:#fff;border-radius:18px;padding:13px 14px;display:none;box-shadow:0 8px 24px #0005}.navrow{display:flex;justify-content:space-between;gap:12px;align-items:center}.navmain{font-weight:900;font-size:18px;line-height:1.15}.navsub{font-size:12px;color:#d7deea;margin-top:5px}.speedbox{font-size:22px;font-weight:900;text-align:right}.mode{position:absolute;z-index:2310;top:152px;right:12px;background:#0b1219e8;color:#7CFC5D;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:900;display:none}.card{position:absolute;z-index:2200;left:12px;right:12px;bottom:78px;background:#fffffff3;border-radius:22px;padding:12px;box-shadow:0 12px 30px #0004}.card h3{margin:0 0 4px;font-size:18px}.card p{margin:0;color:#64748b;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.stat{background:#f1f5f9;border-radius:12px;padding:7px;text-align:center}.stat b{display:block}.stat span{font-size:9px;color:#64748b}.start{position:absolute;z-index:2400;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));width:calc(100% - 24px);min-height:52px;font-size:16px;box-shadow:0 8px 20px #0004}.toast{position:absolute;z-index:3000;top:170px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 12px;border-radius:10px;font-size:12px;display:none}#driverScene{position:absolute;inset:0;z-index:2000;display:none;background-image:linear-gradient(#0002,#0001 55%,#0007),url('https://commons.wikimedia.org/wiki/Special:FilePath/Asphalt%20road%20at%20Shiashie.jpg');background-size:cover;background-position:center 48%;overflow:hidden}.routeRibbon{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 4px 4px #0008)}.hood{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);width:62%;height:88px;border-radius:60% 60% 10% 10%;background:linear-gradient(#56616e,#111820);box-shadow:0 -5px 20px #0008}.driverInfo{position:absolute;left:12px;right:12px;bottom:120px;z-index:2250;background:#10161eea;color:#fff;border-radius:17px;padding:10px 13px;display:none}.driverInfo b{display:block;font-size:14px}.driverInfo span{font-size:11px;color:#cbd5e1}.credit{position:absolute;right:8px;bottom:102px;color:#fff9;font-size:8px}.maplibregl-ctrl-attrib{font-size:8px!important}body.nav-active .top,body.nav-active .card{display:none}body.nav-active .navbar,body.nav-active .mode,body.nav-active #driverScene,body.nav-active .driverInfo{display:block}@media(max-width:500px){body{padding:0;display:block}.phone{width:100vw;height:100svh;border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0}.top{top:max(12px,env(safe-area-inset-top))}.navbar{top:max(12px,env(safe-area-inset-top))}.mode{top:112px}.start{left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));width:calc(100% - 20px)}}</style></head><body><div class="phone"><div class="screen"><div id="map"></div><div id="driverScene"><svg class="routeRibbon" viewBox="0 0 390 800" preserveAspectRatio="none"><path id="routeGlow" d="M195 735 C195 610 195 520 195 420 C195 350 220 305 268 260" fill="none" stroke="#8bb2ff" stroke-width="26" stroke-linecap="round" opacity=".55"/><path id="routeBlue" d="M195 735 C195 610 195 520 195 420 C195 350 220 305 268 260" fill="none" stroke="#1455ff" stroke-width="15" stroke-linecap="round"/><polygon id="routeArrow" points="265,247 286,258 268,273" fill="white"/></svg><div class="hood"></div><div class="credit">Photo: Masssly / Wikimedia Commons CC BY-SA 4.0</div></div><div class="top"><div class="searchwrap"><div class="search"><span>🔎</span><input id="destination" autocomplete="off" placeholder="Enter destination"><button class="btn" id="routeBtn">Route</button></div><div id="suggestions" class="suggestions"></div></div><button class="btn gps" id="gpsBtn">📍</button></div><div id="navbar" class="navbar"><div class="navrow"><div><div id="navMain" class="navmain">Continue</div><div id="navSub" class="navsub">Starting navigation…</div></div><div id="speed" class="speedbox">0</div></div></div><div class="mode">🚗 DRIVER EYE</div><div class="card"><h3 id="title">Choose a destination</h3><p id="subtitle">Type an address or use GPS.</p><div class="stats"><div class="stat"><b id="distance">—</b><span>DISTANCE</span></div><div class="stat"><b id="duration">—</b><span>TIME</span></div><div class="stat"><b id="eta">—</b><span>ETA</span></div></div></div><div class="driverInfo"><b id="driverDest">Destination</b><span id="driverRemain">—</span></div><button class="btn start" id="startBtn">Start Navigation</button><div class="toast" id="toast"></div></div></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>const DEFAULT=[-122.1215,47.674],$=id=>document.getElementById(id);const map=new maplibregl.Map({container:'map',center:DEFAULT,zoom:12,style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap'}},layers:[{id:'osm',type:'raster',source:'osm'}]}});let userLoc=[47.674,-122.1215],destinationPoint=null,currentRoute=null,watchId=null,navigating=false,destMarker=null,carMarker=null,selectedSuggestion=null,searchTimer=null;function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}function ensureCar(){if(carMarker)return;const el=document.createElement('div');el.textContent='🚗';el.style.fontSize='34px';carMarker=new maplibregl.Marker({element:el}).setLngLat([userLoc[1],userLoc[0]]).addTo(map)}function setUser(lat,lon,zoom=true){userLoc=[lat,lon];ensureCar();carMarker.setLngLat([lon,lat]);if(zoom&&!navigating)map.easeTo({center:[lon,lat],zoom:15,duration:500})}function fmtAddr(t,lat,lon){const l1=[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' '),l2=[t['addr:city']||t['addr:place']||t['addr:suburb'],t['addr:state'],t['addr:postcode']].filter(Boolean).join(', ');return{lat,lon,line1:l1||t.name||'Address',line2:l2,name:[l1,l2].filter(Boolean).join(', ')}}async function houseNumberSearch(q){const data=`[out:json][timeout:8];(nwr(around:25000,${userLoc[0]},${userLoc[1]})["addr:housenumber"="${q}"];);out center tags 25;`;const d=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(data)).then(r=>r.json());return(d.elements||[]).map(e=>{const lat=e.lat??e.center?.lat,lon=e.lon??e.center?.lon;return lat&&lon?fmtAddr(e.tags||{},lat,lon):null}).filter(Boolean)}function formatPhoton(f){const p=f.properties||{},l1=[p.housenumber,p.street||p.name].filter(Boolean).join(' ').trim(),l2=[p.city||p.town||p.village,p.state,p.postcode].filter(Boolean).join(', ');return{lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],line1:l1||p.name||'Address',line2:l2,name:[l1,l2].filter(Boolean).join(', ')}}async function photonSearch(q){const d=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=7&lat=${userLoc[0]}&lon=${userLoc[1]}&lang=en`).then(r=>r.json());return(d.features||[]).map(formatPhoton).filter(x=>x.name)}async function autocomplete(q){if(q.length<2){$('suggestions').style.display='none';return}try{let items=[];if(/^\d{3,6}$/.test(q))items=await houseNumberSearch(q);if(items.length<3){const more=await photonSearch(q),seen=new Set(items.map(x=>x.name));for(const x of more)if(!seen.has(x.name))items.push(x)}renderSuggestions(items.slice(0,7))}catch(e){renderSuggestions((await photonSearch(q)).slice(0,7))}}function renderSuggestions(items){const box=$('suggestions');box.innerHTML='';if(!items.length){box.innerHTML='<div class="suggestion"><b>No exact nearby address yet</b><span>Keep typing the street name</span></div>';box.style.display='block';return}items.forEach(x=>{const d=document.createElement('div');d.className='suggestion';d.innerHTML=`<b>${x.line1}</b><span>${x.line2||x.name}</span>`;d.onclick=()=>{selectedSuggestion=x;$('destination').value=x.name;box.style.display='none'};box.appendChild(d)});box.style.display='block'}async function geocode(q){const d=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q='+encodeURIComponent(q)).then(r=>r.json());if(!d.length)throw Error('Destination not found');return{lat:+d[0].lat,lon:+d[0].lon,name:d[0].display_name}}async function getRoute(start,end){const d=await fetch(`https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson&steps=true`).then(r=>r.json());if(!d.routes?.length)throw Error('No route found');return d.routes[0]}const miles=m=>(m/1609.344).toFixed(m<16093?1:0)+' mi',mins=s=>{const m=Math.round(s/60);return m<60?m+' min':Math.floor(m/60)+'h '+m%60+'m'},eta=s=>new Date(Date.now()+s*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});function drawRoad(r){const data={type:'Feature',geometry:r.geometry,properties:{}};if(map.getSource('route'))map.getSource('route').setData(data);else{map.addSource('route',{type:'geojson',data});map.addLayer({id:'edge',type:'line',source:'route',paint:{'line-color':'#fff','line-width':30}});map.addLayer({id:'road',type:'line',source:'route',paint:{'line-color':'#222','line-width':24}});map.addLayer({id:'center',type:'line',source:'route',paint:{'line-color':'#ffd84d','line-width':3,'line-dasharray':[2,2]}})}}function fitRoute(r){const c=r.geometry.coordinates,b=c.reduce((bb,p)=>bb.extend(p),new maplibregl.LngLatBounds(c[0],c[0]));map.fitBounds(b,{padding:{top:130,bottom:270,left:45,right:45},maxZoom:16,duration:600})}function nextStep(r){const s=r?.legs?.[0]?.steps||[];return s.find(x=>x.maneuver?.type!=='depart')||s[0]}function instruction(r){const s=nextStep(r);if(!s)return'Continue';const m=s.maneuver||{},n=s.name?' onto '+s.name:'';if(m.type==='turn')return'Turn '+(m.modifier||'')+n;if(m.type==='merge')return'Merge '+(m.modifier||'')+n;if(m.type==='roundabout')return'Enter roundabout'+n;return'Continue'+n}function updateRibbon(r){const mod=(nextStep(r)?.maneuver?.modifier||'').toLowerCase();let d='M195 735 C195 610 195 520 195 420 C195 350 195 305 195 260',poly='185,247 205,258 187,273';if(mod.includes('right')){d='M195 735 C195 610 195 510 195 420 C195 345 220 300 268 260';poly='260,247 282,258 264,273'}else if(mod.includes('left')){d='M195 735 C195 610 195 510 195 420 C195 345 170 300 122 260';poly='130,247 108,258 126,273'}$('routeGlow').setAttribute('d',d);$('routeBlue').setAttribute('d',d);$('routeArrow').setAttribute('points',poly)}async function buildRoute(){const q=$('destination').value.trim();if(!q)return toast('Enter a destination');$('suggestions').style.display='none';try{const p=selectedSuggestion&&$('destination').value===selectedSuggestion.name?selectedSuggestion:await geocode(q);destinationPoint=[p.lat,p.lon];currentRoute=await getRoute(userLoc,destinationPoint);if(destMarker)destMarker.remove();destMarker=new maplibregl.Marker({color:'#dc2626'}).setLngLat([p.lon,p.lat]).addTo(map);drawRoad(currentRoute);fitRoute(currentRoute);$('title').textContent=p.name.split(',')[0]||q;$('subtitle').textContent=p.name;$('distance').textContent=miles(currentRoute.distance);$('duration').textContent=mins(currentRoute.duration);$('eta').textContent=eta(currentRoute.duration);$('driverDest').textContent=p.name.split(',').slice(0,2).join(', ');toast('Route ready')}catch(e){toast(e.message)}}async function refreshRoute(){try{currentRoute=await getRoute(userLoc,destinationPoint);$('navMain').textContent=instruction(currentRoute);$('navSub').textContent=`${miles(currentRoute.distance)} remaining • ${mins(currentRoute.duration)}`;$('driverRemain').textContent=`${miles(currentRoute.distance)} remaining • ETA ${eta(currentRoute.duration)}`;updateRibbon(currentRoute)}catch(e){$('navSub').textContent='Recalculating…'}}function startNavigation(){if(!currentRoute||!destinationPoint)return toast('Build a route first');navigating=true;document.body.classList.add('nav-active');$('startBtn').textContent='End Trip';$('navMain').textContent=instruction(currentRoute);$('navSub').textContent=`${miles(currentRoute.distance)} remaining • ${mins(currentRoute.duration)}`;$('driverRemain').textContent=`${miles(currentRoute.distance)} remaining • ETA ${eta(currentRoute.duration)}`;updateRibbon(currentRoute);let last=0;watchId=navigator.geolocation.watchPosition(async p=>{setUser(p.coords.latitude,p.coords.longitude,false);$('speed').innerHTML=Math.max(0,Math.round((p.coords.speed||0)*2.237))+'<span style="display:block;font-size:9px">mph</span>';if(Date.now()-last>7000){last=Date.now();await refreshRoute()}},()=>toast('Allow precise location'),{enableHighAccuracy:true,maximumAge:1000,timeout:15000});toast('Photoreal Driver Eye started')}function stopNavigation(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;navigating=false;document.body.classList.remove('nav-active');$('startBtn').textContent='Start Navigation'}$('gpsBtn').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{setUser(p.coords.latitude,p.coords.longitude,true);toast('GPS updated')},()=>toast('Allow location permission'),{enableHighAccuracy:true});$('routeBtn').onclick=buildRoute;$('destination').addEventListener('input',e=>{selectedSuggestion=null;clearTimeout(searchTimer);searchTimer=setTimeout(()=>autocomplete(e.target.value.trim()),450)});$('destination').addEventListener('keydown',e=>e.key==='Enter'&&buildRoute());$('startBtn').onclick=()=>navigating?stopNavigation():startNavigation();map.on('load',ensureCar);</script></body></html>
