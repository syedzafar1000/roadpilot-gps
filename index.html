<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RoadPilot GPS</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#0b1020}body{min-height:100dvh;overflow:hidden}.screen,#map{position:absolute;inset:0}.screen{overflow:hidden}.top{position:absolute;z-index:2200;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px}.searchwrap{flex:1;position:relative}.search{display:flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 6px 20px #0004}.search input{border:0;outline:0;flex:1;min-width:0;font-size:14px}.btn{border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:800;padding:10px;touch-action:manipulation}.gps{width:48px;background:#fff;color:#111}.historyBtn{background:#eef2ff;color:#1d4ed8;width:42px;padding:9px 6px}.suggestions{position:absolute;top:54px;left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 12px 28px #0005;max-height:330px;overflow:auto;display:none;z-index:3100}.suggestion{padding:11px 12px;border-bottom:1px solid #e5e7eb}.suggestion b{display:block;font-size:13px}.suggestion span{display:block;font-size:11px;color:#64748b;margin-top:3px}.recent{color:#2563eb!important;font-weight:700}.exact{color:#15803d!important;font-weight:700}.warn{color:#b45309!important;font-weight:700}.card{position:absolute;z-index:2200;left:12px;right:12px;bottom:82px;background:#fffffff3;border-radius:20px;padding:12px;box-shadow:0 12px 30px #0004}.card h3{margin:0 0 4px;font-size:18px}.card p{margin:0;color:#64748b;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.stat{background:#f1f5f9;border-radius:12px;padding:7px;text-align:center}.stat b{display:block}.stat span{font-size:9px;color:#64748b}.start{position:absolute;z-index:2900;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));width:calc(100% - 20px);min-height:58px;font-size:17px}.appToast{position:absolute;z-index:4000;left:50%;top:115px;transform:translateX(-50%);background:#111827ee;color:#fff;padding:9px 13px;border-radius:12px;font-size:12px;font-weight:700;display:none;max-width:88%;text-align:center}.driver{position:absolute;inset:0;z-index:2000;background:#111;display:none;isolation:isolate}.mly{position:absolute;inset:0;z-index:1!important}.mly canvas,.mly .mapillary-container{z-index:1!important}.shade{position:absolute;inset:0;z-index:20;pointer-events:none;background:linear-gradient(#0005 0 17%,transparent 32% 70%,#0008 100%)}.turnPanel{position:absolute;z-index:80;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;background:#087b34ef;color:#fff;border-radius:18px;padding:13px 14px;box-shadow:0 8px 26px #0007}.turnRow{display:flex;align-items:center;gap:12px}.turnIcon{font-size:42px;line-height:1;width:56px;text-align:center}.turnText{flex:1}.turnDistance{font-size:13px;font-weight:800}.turnStreet{font-size:21px;font-weight:900;line-height:1.1}.speed{font-size:15px;font-weight:800}.routePerspective{position:absolute;inset:0;z-index:60!important;pointer-events:none;overflow:visible}.routeGlow{fill:none;stroke:#8fc1ff;stroke-width:48;opacity:.45;stroke-linecap:round;stroke-linejoin:round}.routeLine{fill:none;stroke:#087cff;stroke-width:30;opacity:.97;stroke-linecap:round;stroke-linejoin:round}.routeCenter{fill:none;stroke:#6db4ff;stroke-width:5;opacity:.8;stroke-linecap:round}.routeArrow{fill:#fff;stroke:#087cff;stroke-width:2}.mode{position:absolute;z-index:80;right:12px;top:112px;background:#0d1725e8;color:#7CFC5D;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:900}.driverInfo{position:absolute;z-index:75;left:12px;right:12px;bottom:112px;background:#10161eea;color:#fff;border-radius:17px;padding:10px 13px}.driverInfo b{display:block;font-size:14px}.driverInfo span{font-size:11px;color:#cbd5e1}.seqControls{position:absolute;z-index:90;left:50%;transform:translateX(-50%);bottom:235px;display:flex;gap:18px}.seqBtn{width:72px;height:58px;border:2px solid #ffffffdd;border-radius:18px;background:#101827ee;color:#fff;font-size:30px;font-weight:900;box-shadow:0 8px 22px #0008}.hood{position:absolute;z-index:50;pointer-events:none;left:50%;bottom:52px;transform:translateX(-50%);width:60%;height:82px;border-radius:60% 60% 10% 10%;background:linear-gradient(#536171aa,#111820dd)}body.nav-active .top,body.nav-active .card{display:none}body.nav-active .driver{display:block}
</style>
</head>
<body>
<div class="screen">
<div id="map"></div>
<div id="driver" class="driver">
  <div id="mly" class="mly"></div>
  <div class="shade"></div>
  <div class="turnPanel"><div class="turnRow"><div id="turnIcon" class="turnIcon">↑</div><div class="turnText"><div id="turnDistance" class="turnDistance">Continue</div><div id="turnStreet" class="turnStreet">Follow route</div></div><div id="speed" class="speed">0 mph</div></div></div>
  <div class="mode">📷 ROAD VIEW</div>
  <svg class="routePerspective" viewBox="0 0 390 844" preserveAspectRatio="none">
    <path id="routeGlow" class="routeGlow" d="M195 820 C195 720 195 620 195 520 C195 440 195 380 195 320"/>
    <path id="routeLine" class="routeLine" d="M195 820 C195 720 195 620 195 520 C195 440 195 380 195 320"/>
    <path id="routeCenter" class="routeCenter" d="M195 820 C195 720 195 620 195 520 C195 440 195 380 195 320"/>
    <polygon id="routeArrow" class="routeArrow" points="178,310 212,320 180,340"/>
  </svg>
  <div class="seqControls"><button id="prevStreet" class="seqBtn" type="button">◀</button><button id="nextStreet" class="seqBtn" type="button">▶</button></div>
  <div class="driverInfo"><b id="driverDest">Destination</b><span id="driverRemain">—</span></div>
  <div class="hood"></div>
</div>
<div class="top"><div class="searchwrap"><div class="search"><span>🔎</span><input id="destination" autocomplete="off" placeholder="Enter full address"><button id="historyBtn" class="btn historyBtn" type="button">🕘</button><button id="routeBtn" class="btn" type="button">Route</button></div><div id="suggestions" class="suggestions"></div></div><button id="gpsBtn" class="btn gps" type="button">📍</button></div>
<div class="card"><h3 id="title">Choose a destination</h3><p id="subtitle">Select an exact address.</p><div class="stats"><div class="stat"><b id="distance">—</b><span>DISTANCE</span></div><div class="stat"><b id="duration">—</b><span>TIME</span></div><div class="stat"><b id="eta">—</b><span>ETA</span></div></div></div>
<button id="startBtn" class="btn start" type="button">Start Navigation</button>
<div id="appToast" class="appToast"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js"></script>
<script>
const $=id=>document.getElementById(id),DEFAULT=[47.674,-122.1215];
let userLoc=[...DEFAULT],dest=null,route=null,selected=null,watchId=null,navigating=false,mly=null,routeIndex=0,manual=false,lastImageId=null,searchTimer=null,lastStreetLoc=null,currentHeading=null;
const map=new maplibregl.Map({container:'map',center:[DEFAULT[1],DEFAULT[0]],zoom:12,style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256}},layers:[{id:'osm',type:'raster',source:'osm'}]}});
function toast(t){const e=$('appToast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2300)}
function miles(m){return(m/1609.344).toFixed(1)+' mi'} function mins(s){return Math.max(1,Math.round(s/60))+' min'} function eta(s){return new Date(Date.now()+s*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function dist(a,b){const R=6371000,p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,dp=(b[0]-a[0])*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180,q=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function bearing(a,b){const p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180,y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return(Math.atan2(y,x)*180/Math.PI+360)%360}
function angleDiff(a,b){return Math.abs(((a-b+540)%360)-180)}
function history(){try{const a=JSON.parse(localStorage.getItem('roadpilot_history')||'[]'),b=JSON.parse(localStorage.getItem('roadpilot_address_history')||'[]');const all=[...a,...b],seen=new Set();return all.filter(x=>x&&x.name&&!seen.has(x.name)&&seen.add(x.name)).slice(0,15)}catch{return[]}}
function saveHistory(p){const clean={name:p.name,line1:p.line1,line2:p.line2,lat:p.lat,lon:p.lon,exact:true};let h=history().filter(x=>x.name!==clean.name);h.unshift(clean);localStorage.setItem('roadpilot_history',JSON.stringify(h.slice(0,15)));localStorage.setItem('roadpilot_address_history',JSON.stringify(h.slice(0,15)))}
function showHistory(){const h=history(),b=$('suggestions');b.innerHTML='';if(!h.length){b.innerHTML='<div class="suggestion"><b>No recent destinations yet</b><span>Addresses will appear here after you build a route.</span></div>';b.style.display='block';return}h.forEach(x=>{const d=document.createElement('div');d.className='suggestion';d.innerHTML=`<b>🕘 ${x.line1||x.name}</b><span>${x.line2||x.name}</span><span class="recent">Recent destination</span>`;d.onclick=()=>{selected=x;$('destination').value=x.name;b.style.display='none'};b.appendChild(d)});b.style.display='block'}
function token(){let t=localStorage.getItem('roadpilot_mapillary_token');if(t)return t;t=prompt('Paste your Mapillary Access Token once.');if(t){t=t.trim();localStorage.setItem('roadpilot_mapillary_token',t)}return t||''}
function ensureViewer(){if(mly)return mly;const t=token();if(!t)return null;mly=new mapillary.Viewer({accessToken:t,container:'mly',component:{sequence:{visible:true}}});mly.on('image',e=>{lastImageId=e?.image?.id||lastImageId});return mly}
function getFreshGPS(){return new Promise(resolve=>{if(!navigator.geolocation)return resolve(false);navigator.geolocation.getCurrentPosition(p=>{userLoc=[p.coords.latitude,p.coords.longitude];if(Number.isFinite(p.coords.heading))currentHeading=p.coords.heading;resolve(true)},()=>resolve(false),{enableHighAccuracy:true,maximumAge:0,timeout:12000})})}
async function geo(q){const d=.18,v=`${userLoc[1]-d},${userLoc[0]+d},${userLoc[1]+d},${userLoc[0]-d}`,u=`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&countrycodes=us&viewbox=${encodeURIComponent(v)}&q=${encodeURIComponent(q)}`;const a=await fetch(u).then(r=>r.json());return a.map(x=>{const z=x.address||{},house=z.house_number||'',road=z.road||z.residential||z.pedestrian||'',city=z.city||z.town||z.village||z.suburb||'',state=z.state||'',zip=z.postcode||'',line1=[house,road].filter(Boolean).join(' ')||x.display_name.split(',')[0],line2=[city,state,zip].filter(Boolean).join(', ');return{lat:+x.lat,lon:+x.lon,name:x.display_name,line1,line2,exact:!!(house&&road)}})}
function render(items){const b=$('suggestions');b.innerHTML='';items.forEach(x=>{const d=document.createElement('div');d.className='suggestion';d.innerHTML=`<b>${x.line1}</b><span>${x.line2||x.name}</span><span class="${x.exact?'exact':'warn'}">${x.exact?'✓ Exact address':'Add house number for exact routing'}</span>`;d.onclick=()=>{selected=x;$('destination').value=x.name;b.style.display='none'};b.appendChild(d)});b.style.display=items.length?'block':'none'}
async function getRoute(s,e){const u=`https://router.project-osrm.org/route/v1/driving/${s[1]},${s[0]};${e[1]},${e[0]}?overview=full&geometries=geojson&steps=true`;const d=await fetch(u).then(r=>r.json());if(!d.routes?.length)throw Error('No route found');return d.routes[0]}
function coords(){return route?.geometry?.coordinates||[]}
function nearestIndex(loc){let bi=0,bd=1e99;coords().forEach((c,i)=>{const d=dist(loc,[c[1],c[0]]);if(d<bd){bd=d;bi=i}});return bi}
function routeHeading(){const c=coords();if(c.length<2)return null;const i=nearestIndex(userLoc),j=Math.min(c.length-1,i+Math.max(2,Math.floor(c.length/100)));return i===j?null:bearing([c[i][1],c[i][0]],[c[j][1],c[j][0]])}
function stepInfo(r=route){const s=r?.legs?.[0]?.steps||[],x=s.find(v=>v.maneuver?.type!=='depart'&&v.distance>8)||s[0];if(!x)return{icon:'↑',street:'Continue',distance:'',mod:''};const m=x.maneuver||{},mod=(m.modifier||'').toLowerCase(),icon=mod.includes('right')?'↱':mod.includes('left')?'↰':mod.includes('uturn')?'↶':'↑';const ft=x.distance*3.28084;const label=ft<1000?`${Math.max(25,Math.round(ft/25)*25)} ft`:`${(ft/5280).toFixed(1)} mi`;return{icon,street:x.name||'Continue',distance:label,mod}}
function updatePerspective(info){let d='M195 820 C195 720 195 620 195 520 C195 440 195 380 195 320',p='178,310 212,320 180,340';if(info.mod.includes('right')){d='M195 820 C195 720 195 620 195 520 C195 445 220 375 300 320';p='286,303 318,320 286,341'}else if(info.mod.includes('left')){d='M195 820 C195 720 195 620 195 520 C195 445 170 375 90 320';p='104,303 72,320 104,341'}for(const id of ['routeGlow','routeLine','routeCenter'])$(id).setAttribute('d',d);$('routeArrow').setAttribute('points',p)}
function updateGuidance(r=route){const i=stepInfo(r);$('turnIcon').textContent=i.icon;$('turnStreet').textContent=i.street;$('turnDistance').textContent=i.distance?`In ${i.distance}`:'Continue';updatePerspective(i);if(r)$('driverRemain').textContent=`${miles(r.distance)} remaining • ETA ${eta(r.duration)}`}
async function findStreetImage(){const t=token();if(!t)throw Error('Mapillary token needed');const lat=userLoc[0],lon=userLoc[1],d=.0022,bbox=`${lon-d},${lat-d},${lon+d},${lat+d}`,u=`https://graph.mapillary.com/images?access_token=${encodeURIComponent(t)}&fields=id,computed_geometry,compass_angle&bbox=${bbox}&limit=100`;const data=await fetch(u).then(r=>{if(!r.ok)throw Error('Street imagery unavailable');return r.json()}),imgs=(data.data||[]).filter(x=>x.computed_geometry?.coordinates);if(!imgs.length)throw Error('No street imagery near this route point');const desired=Number.isFinite(currentHeading)?currentHeading:routeHeading();imgs.forEach(x=>{const A=x.computed_geometry.coordinates,dm=dist(userLoc,[A[1],A[0]]),ad=desired!=null&&Number.isFinite(+x.compass_angle)?angleDiff(+x.compass_angle,desired):0;x._score=dm+ad*2.5});imgs.sort((a,b)=>a._score-b._score);return imgs[0].id}
async function syncStreet(force=false){if(!navigating)return;if(!force&&lastStreetLoc&&dist(lastStreetLoc,userLoc)<45)return;try{const v=ensureViewer(),id=await findStreetImage();if(v&&id!==lastImageId){await v.moveTo(id);lastImageId=id}lastStreetLoc=[...userLoc]}catch(e){toast(e.message)}}
async function previewUpdate(){if(!dest)return;try{const r=await getRoute(userLoc,dest);updateGuidance(r)}catch{}}
function jump(dir){const c=coords();if(!c.length)return;manual=true;const step=Math.max(3,Math.floor(c.length/60));routeIndex=Math.max(0,Math.min(c.length-1,routeIndex+(dir==='next'?step:-step)));userLoc=[c[routeIndex][1],c[routeIndex][0]];previewUpdate();syncStreet(true);if(routeIndex>=c.length-2)toast('Destination reached')}
async function buildRoute(){const q=$('destination').value.trim();if(!q)return toast('Enter a destination');try{toast('Getting your current location…');await getFreshGPS();let p=selected&&$('destination').value===selected.name?selected:null;if(!p){const r=await geo(q);p=r.find(x=>x.exact)||r[0]}if(!p)throw Error('Address not found');if(!p.exact)throw Error('Enter house number for exact routing');dest=[p.lat,p.lon];route=await getRoute(userLoc,dest);routeIndex=nearestIndex(userLoc);selected=p;saveHistory(p);const c=coords(),b=c.reduce((bb,x)=>bb.extend(x),new maplibregl.LngLatBounds(c[0],c[0]));map.fitBounds(b,{padding:80,maxZoom:16});$('title').textContent=p.line1;$('subtitle').textContent=p.name;$('distance').textContent=miles(route.distance);$('duration').textContent=mins(route.duration);$('eta').textContent=eta(route.duration);$('driverDest').textContent=p.line1;toast('Route ready • destination saved')}catch(e){toast(e.message)}}
async function start(){if(!route||!dest)return toast('Build a route first');await getFreshGPS();try{route=await getRoute(userLoc,dest)}catch{}navigating=true;manual=false;lastStreetLoc=null;routeIndex=nearestIndex(userLoc);document.body.classList.add('nav-active');$('startBtn').textContent='End Trip';updateGuidance(route);syncStreet(true);if(navigator.geolocation)watchId=navigator.geolocation.watchPosition(async p=>{if(!manual){userLoc=[p.coords.latitude,p.coords.longitude];if(Number.isFinite(p.coords.heading))currentHeading=p.coords.heading;routeIndex=nearestIndex(userLoc)}$('speed').textContent=Math.max(0,Math.round((p.coords.speed||0)*2.237))+' mph';if(!manual){try{route=await getRoute(userLoc,dest);updateGuidance(route);syncStreet()}catch{}}},()=>toast('Allow GPS for live navigation'),{enableHighAccuracy:true,maximumAge:1000,timeout:20000})}
function stop(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;navigating=false;manual=false;document.body.classList.remove('nav-active');$('startBtn').textContent='Start Navigation'}
$('routeBtn').onclick=buildRoute;$('startBtn').onclick=()=>navigating?stop():start();$('nextStreet').onclick=()=>jump('next');$('prevStreet').onclick=()=>jump('prev');$('historyBtn').onclick=showHistory;$('gpsBtn').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{userLoc=[p.coords.latitude,p.coords.longitude];map.easeTo({center:[userLoc[1],userLoc[0]],zoom:15});toast('GPS updated')},()=>toast('Allow location in Safari'),{enableHighAccuracy:true});$('destination').addEventListener('focus',e=>{if(!e.target.value.trim())showHistory()});$('destination').addEventListener('input',e=>{selected=null;clearTimeout(searchTimer);const q=e.target.value.trim();searchTimer=setTimeout(async()=>q.length<2?showHistory():render(await geo(q)),400)});$('destination').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();buildRoute()}});
</script>
</body>
</html>
