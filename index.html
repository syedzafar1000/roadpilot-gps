<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>RoadPilot GPS</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><link rel="stylesheet" href="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#0b1020}body{min-height:100dvh;overflow:hidden}.screen,#map{position:absolute;inset:0}.top{position:absolute;z-index:2200;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px}.searchwrap{flex:1;position:relative}.search{display:flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 6px 20px #0004}.search input{border:0;outline:0;flex:1;min-width:0;font-size:14px}.btn{border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:800;padding:10px;touch-action:manipulation}.gps{width:48px;background:#fff;color:#111}.historyBtn{background:#eef2ff;color:#1d4ed8;width:42px}.suggestions{position:absolute;top:54px;left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 12px 28px #0005;max-height:330px;overflow:auto;display:none;z-index:3100}.suggestion{padding:11px 12px;border-bottom:1px solid #e5e7eb}.suggestion b{display:block;font-size:13px}.suggestion span{display:block;font-size:11px;color:#64748b;margin-top:3px}.recent{color:#2563eb!important;font-weight:700}.exact{color:#15803d!important;font-weight:700}.warn{color:#b45309!important;font-weight:700}.card{position:absolute;z-index:2200;left:12px;right:12px;bottom:82px;background:#fffffff3;border-radius:20px;padding:12px;box-shadow:0 12px 30px #0004}.card h3{margin:0 0 4px;font-size:18px}.card p{margin:0;color:#64748b;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.stat{background:#f1f5f9;border-radius:12px;padding:7px;text-align:center}.stat b{display:block}.stat span{font-size:9px;color:#64748b}.start{position:absolute;z-index:2900;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));width:calc(100% - 20px);min-height:58px;font-size:17px}.appToast{position:absolute;z-index:4000;left:50%;top:115px;transform:translateX(-50%);background:#111827ee;color:#fff;padding:9px 13px;border-radius:12px;font-size:12px;font-weight:700;display:none;max-width:88%;text-align:center}.driver{position:absolute;inset:0;z-index:2000;background:transparent;display:none;isolation:isolate}.mly{position:absolute;inset:0;z-index:2!important;background:transparent}.mly canvas,.mly .mapillary-container{z-index:2!important}.shade{position:absolute;inset:0;z-index:20;pointer-events:none;background:linear-gradient(#0004 0 16%,transparent 30% 72%,#0007 100%)}.turnPanel{position:absolute;z-index:80;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;background:linear-gradient(135deg,#075f32f5,#0b7f46f5);color:#fff;border:1px solid #62e58c88;border-radius:20px;padding:13px 14px;box-shadow:0 10px 28px #0008}.turnRow{display:flex;align-items:center;gap:12px}.turnIcon{font-size:42px;line-height:1;width:56px;text-align:center}.turnText{flex:1}.turnDistance{font-size:13px;font-weight:800;color:#8fffb0}.turnStreet{font-size:21px;font-weight:900;line-height:1.1}.speed{font-size:15px;font-weight:800}.routePerspective{position:absolute;inset:0;z-index:60!important;pointer-events:none;transform-origin:50% 100%;transition:transform .25s ease,opacity .2s ease}.routeRibbon{fill:url(#routeGradient);stroke:#9affc7;stroke-width:1.4;opacity:.72}.routeEdge{fill:none;stroke:#b7ffdc;stroke-width:2;opacity:.8}.chevron{fill:none;stroke:#e6fff0;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.95}.mode{position:absolute;z-index:80;right:12px;top:112px;background:#0d1725e8;color:#75ff9d;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:900}.driverInfo{position:absolute;z-index:75;left:12px;right:12px;bottom:112px;background:#10161ef2;color:#fff;border:1px solid #ffffff18;border-radius:19px;padding:11px 14px;box-shadow:0 8px 22px #0006}.driverInfo b{display:block;font-size:14px}.driverInfo span{font-size:11px;color:#cbd5e1}.roadStatus{position:absolute;z-index:70;left:50%;top:48%;transform:translate(-50%,-50%);background:#0f172acc;color:white;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:800;display:none}.build{position:absolute;z-index:85;left:12px;top:112px;background:#052e1bee;color:#7dffaf;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900}.hood{position:absolute;z-index:50;pointer-events:none;left:50%;bottom:52px;transform:translateX(-50%);width:60%;height:82px;border-radius:60% 60% 10% 10%;background:linear-gradient(#53617166,#111820bb)}body.nav-active .top,body.nav-active .card{display:none}body.nav-active .driver{display:block}</style></head><body><div class="screen"><div id="map"></div><div id="driver" class="driver"><div id="mly" class="mly"></div><div class="shade"></div><div class="turnPanel"><div class="turnRow"><div id="turnIcon" class="turnIcon">↑</div><div class="turnText"><div id="turnDistance" class="turnDistance">Continue</div><div id="turnStreet" class="turnStreet">Follow route</div></div><div id="speed" class="speed">0 mph</div></div></div><div class="build">GPS LIVE v3</div><div class="mode">📍 GPS ROAD VIEW</div><div id="roadStatus" class="roadStatus">Loading road imagery…</div><svg id="routeOverlay" class="routePerspective" viewBox="0 0 390 844" preserveAspectRatio="none"><defs><linearGradient id="routeGradient" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#075f46"/><stop offset=".55" stop-color="#0f8f67"/><stop offset="1" stop-color="#40d99c"/></linearGradient></defs><polygon class="routeRibbon" points="150,844 240,844 208,385 182,385"/><polyline class="routeEdge" points="150,844 182,385"/><polyline class="routeEdge" points="240,844 208,385"/><g><polyline class="chevron" points="165,735 195,715 225,735"/><polyline class="chevron" points="171,650 195,633 219,650"/><polyline class="chevron" points="176,575 195,561 214,575"/><polyline class="chevron" points="181,510 195,499 209,510"/><polyline class="chevron" points="185,455 195,447 205,455"/><polyline class="chevron" points="188,417 195,411 202,417"/></g></svg><div class="driverInfo"><b id="driverDest">Destination</b><span id="driverRemain">—</span></div><div class="hood"></div></div><div class="top"><div class="searchwrap"><div class="search"><span>🔎</span><input id="destination" autocomplete="off" placeholder="Enter full address"><button id="historyBtn" class="btn historyBtn" type="button">🕘</button><button id="routeBtn" class="btn" type="button">Route</button></div><div id="suggestions" class="suggestions"></div></div><button id="gpsBtn" class="btn gps" type="button">📍</button></div><div class="card"><h3 id="title">Choose a destination</h3><p id="subtitle">Select an exact address.</p><div class="stats"><div class="stat"><b id="distance">—</b><span>DISTANCE</span></div><div class="stat"><b id="duration">—</b><span>TIME</span></div><div class="stat"><b id="eta">—</b><span>ETA</span></div></div></div><button id="startBtn" class="btn start" type="button">Start Navigation</button><div id="appToast" class="appToast"></div></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script src="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js"></script><script>const $=id=>document.getElementById(id),DEFAULT=[47.674,-122.1215];let userLoc=[...DEFAULT],dest=null,route=null,selected=null,watchId=null,navigating=false,mly=null,searchTimer=null,lastStreetLoc=null,currentImageHeading=null,lastRouteRefresh=0;const map=new maplibregl.Map({container:'map',center:[DEFAULT[1],DEFAULT[0]],zoom:12,style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256}},layers:[{id:'osm',type:'raster',source:'osm'}]}});function toast(t){const e=$('appToast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2300)}function status(t,on=true){const e=$('roadStatus');e.textContent=t;e.style.display=on?'block':'none'}function miles(m){return(m/1609.344).toFixed(1)+' mi'}function mins(s){return Math.max(1,Math.round(s/60))+' min'}function eta(s){return new Date(Date.now()+s*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}function dist(a,b){const R=6371000,p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,dp=(b[0]-a[0])*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180,q=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function bearing(a,b){const p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180,y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return(Math.atan2(y,x)*180/Math.PI+360)%360}function signedAngle(a,b){return((a-b+540)%360)-180}function history(){try{const a=JSON.parse(localStorage.getItem('roadpilot_history')||'[]'),b=JSON.parse(localStorage.getItem('roadpilot_address_history')||'[]'),seen=new Set();return[...a,...b].filter(x=>x&&x.name&&!seen.has(x.name)&&seen.add(x.name)).slice(0,15)}catch{return[]}}function saveHistory(p){const c={name:p.name,line1:p.line1,line2:p.line2,lat:p.lat,lon:p.lon,exact:true};let h=history().filter(x=>x.name!==c.name);h.unshift(c);localStorage.setItem('roadpilot_history',JSON.stringify(h.slice(0,15)));localStorage.setItem('roadpilot_address_history',JSON.stringify(h.slice(0,15)))}function showHistory(){const h=history(),b=$('suggestions');b.innerHTML='';if(!h.length){b.innerHTML='<div class="suggestion"><b>No recent destinations yet</b><span>Addresses appear here after you build a route.</span></div>';b.style.display='block';return}h.forEach(x=>{const d=document.createElement('div');d.className='suggestion';d.innerHTML=`<b>🕘 ${x.line1||x.name}</b><span>${x.line2||x.name}</span><span class="recent">Recent destination</span>`;d.onclick=()=>{selected=x;$('destination').value=x.name;b.style.display='none'};b.appendChild(d)});b.style.display='block'}function token(){let t=localStorage.getItem('roadpilot_mapillary_token');if(t)return t;t=prompt('Paste your Mapillary Access Token once.');if(t){t=t.trim();localStorage.setItem('roadpilot_mapillary_token',t)}return t||''}function ensureViewer(){if(mly)return mly;const t=token();if(!t)throw Error('Mapillary token needed');mly=new mapillary.Viewer({accessToken:t,container:'mly'});setTimeout(()=>{try{mly.resize()}catch{}},100);return mly}function getFreshGPS(){return new Promise(resolve=>{if(!navigator.geolocation)return resolve(false);navigator.geolocation.getCurrentPosition(p=>{userLoc=[p.coords.latitude,p.coords.longitude];resolve(true)},()=>resolve(false),{enableHighAccuracy:true,maximumAge:0,timeout:12000})})}async function geo(q){const d=.18,v=`${userLoc[1]-d},${userLoc[0]+d},${userLoc[1]+d},${userLoc[0]-d}`,u=`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&countrycodes=us&viewbox=${encodeURIComponent(v)}&q=${encodeURIComponent(q)}`;const a=await fetch(u).then(r=>r.json());return a.map(x=>{const z=x.address||{},house=z.house_number||'',road=z.road||z.residential||z.pedestrian||'',city=z.city||z.town||z.village||z.suburb||'',state=z.state||'',zip=z.postcode||'',line1=[house,road].filter(Boolean).join(' ')||x.display_name.split(',')[0],line2=[city,state,zip].filter(Boolean).join(', ');return{lat:+x.lat,lon:+x.lon,name:x.display_name,line1,line2,exact:!!(house&&road)}})}function render(items){const b=$('suggestions');b.innerHTML='';items.forEach(x=>{const d=document.createElement('div');d.className='suggestion';d.innerHTML=`<b>${x.line1}</b><span>${x.line2||x.name}</span><span class="${x.exact?'exact':'warn'}">${x.exact?'✓ Exact address':'Add house number for exact routing'}</span>`;d.onclick=()=>{selected=x;$('destination').value=x.name;b.style.display='none'};b.appendChild(d)});b.style.display=items.length?'block':'none'}async function getRoute(s,e){const u=`https://router.project-osrm.org/route/v1/driving/${s[1]},${s[0]};${e[1]},${e[0]}?overview=full&geometries=geojson&steps=true`;const d=await fetch(u).then(r=>r.json());if(!d.routes?.length)throw Error('No route found');return d.routes[0]}function coords(){return route?.geometry?.coordinates||[]}function nearestIndex(loc){let bi=0,bd=Infinity;coords().forEach((c,i)=>{const x=dist(loc,[c[1],c[0]]);if(x<bd){bd=x;bi=i}});return bi}function routeHeadingAt(){const c=coords();if(c.length<2)return null;const i=nearestIndex(userLoc),j=Math.min(c.length-1,i+Math.max(2,Math.floor(c.length/120)));return i===j?null:bearing([c[i][1],c[i][0]],[c[j][1],c[j][0]])}function stepInfo(r=route){const s=r?.legs?.[0]?.steps||[],x=s.find(v=>v.maneuver?.type!=='depart'&&v.distance>8)||s[0];if(!x)return{icon:'↑',street:'Continue',distance:''};const m=x.maneuver||{},mod=(m.modifier||'').toLowerCase(),icon=mod.includes('right')?'↱':mod.includes('left')?'↰':mod.includes('uturn')?'↶':'↑',ft=x.distance*3.28084,label=ft<1000?`${Math.max(25,Math.round(ft/25)*25)} ft`:`${(ft/5280).toFixed(1)} mi`;return{icon,street:x.name||'Continue',distance:label}}function updateGuidance(r=route){const i=stepInfo(r);$('turnIcon').textContent=i.icon;$('turnStreet').textContent=i.street;$('turnDistance').textContent=i.distance?`In ${i.distance}`:'Continue';if(r)$('driverRemain').textContent=`${miles(r.distance)} remaining • ETA ${eta(r.duration)}`;alignRibbon()}function alignRibbon(){const o=$('routeOverlay'),rh=routeHeadingAt();if(rh==null||currentImageHeading==null){o.style.opacity='.76';o.style.transform='translateX(0)';return}const d=signedAngle(rh,currentImageHeading),ad=Math.abs(d);if(ad>65){o.style.opacity='0';return}o.style.opacity=ad>40?'.4':'.8';o.style.transform=`translateX(${Math.max(-70,Math.min(70,d*1.4))}px)`}async function findStreetImage(){const t=token();if(!t)throw Error('Mapillary token needed');const lat=userLoc[0],lon=userLoc[1],d=.003,bbox=`${lon-d},${lat-d},${lon+d},${lat+d}`,u=`https://graph.mapillary.com/images?access_token=${encodeURIComponent(t)}&fields=id,computed_geometry,compass_angle&bbox=${bbox}&limit=100`;const data=await fetch(u).then(r=>{if(!r.ok)throw Error('Street imagery unavailable');return r.json()}),imgs=(data.data||[]).filter(x=>x.computed_geometry?.coordinates),desired=routeHeadingAt();if(!imgs.length)throw Error('No road imagery near your GPS position');imgs.forEach(x=>{const A=x.computed_geometry.coordinates,dm=dist(userLoc,[A[1],A[0]]),ad=desired!=null&&Number.isFinite(+x.compass_angle)?Math.abs(signedAngle(+x.compass_angle,desired)):90;x._score=dm+ad*6});imgs.sort((a,b)=>a._score-b._score);return imgs[0]}async function showStreet(force=false){if(!navigating)return;if(!force&&lastStreetLoc&&dist(lastStreetLoc,userLoc)<30)return;status('Loading road imagery…',true);try{const v=ensureViewer();try{v.resize()}catch{}const img=await findStreetImage();currentImageHeading=Number.isFinite(+img.compass_angle)?+img.compass_angle:null;await v.moveTo(img.id);lastStreetLoc=[...userLoc];status('',false);alignRibbon()}catch(e){status('Road imagery unavailable here — GPS navigation is still active',true);$('routeOverlay').style.opacity='0';toast(e.message)}}async function refreshRoute(force=false){if(!dest||!navigating)return;if(!force&&Date.now()-lastRouteRefresh<4000)return;lastRouteRefresh=Date.now();try{route=await getRoute(userLoc,dest);updateGuidance(route);if(route.distance<45){$('turnIcon').textContent='✓';$('turnDistance').textContent='Arriving';$('turnStreet').textContent=$('driverDest').textContent}await showStreet()}catch{toast('Recalculating route…')}}async function buildRoute(){const q=$('destination').value.trim();if(!q)return toast('Enter a destination');try{toast('Getting your current location…');await getFreshGPS();let p=selected&&$('destination').value===selected.name?selected:null;if(!p){const r=await geo(q);p=r.find(x=>x.exact)||r[0]}if(!p)throw Error('Address not found');if(!p.exact)throw Error('Enter house number for exact routing');dest=[p.lat,p.lon];route=await getRoute(userLoc,dest);selected=p;saveHistory(p);const c=coords(),b=c.reduce((bb,x)=>bb.extend(x),new maplibregl.LngLatBounds(c[0],c[0]));map.fitBounds(b,{padding:80,maxZoom:16});$('title').textContent=p.line1;$('subtitle').textContent=p.name;$('distance').textContent=miles(route.distance);$('duration').textContent=mins(route.duration);$('eta').textContent=eta(route.duration);$('driverDest').textContent=p.line1;toast('Route ready • destination saved')}catch(e){toast(e.message)}}async function start(){if(!route||!dest)return toast('Build a route first');await getFreshGPS();try{route=await getRoute(userLoc,dest)}catch{}navigating=true;lastStreetLoc=null;currentImageHeading=null;lastRouteRefresh=0;document.body.classList.add('nav-active');$('startBtn').textContent='End Trip';updateGuidance(route);setTimeout(()=>showStreet(true),150);if(navigator.geolocation)watchId=navigator.geolocation.watchPosition(async p=>{userLoc=[p.coords.latitude,p.coords.longitude];$('speed').textContent=Math.max(0,Math.round((p.coords.speed||0)*2.237))+' mph';await refreshRoute()},()=>toast('Allow GPS for live navigation'),{enableHighAccuracy:true,maximumAge:1000,timeout:20000})}function stop(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;navigating=false;document.body.classList.remove('nav-active');$('startBtn').textContent='Start Navigation';status('',false)}$('routeBtn').onclick=buildRoute;$('startBtn').onclick=()=>navigating?stop():start();$('historyBtn').onclick=showHistory;$('gpsBtn').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{userLoc=[p.coords.latitude,p.coords.longitude];map.easeTo({center:[userLoc[1],userLoc[0]],zoom:15});toast('GPS updated')},()=>toast('Allow location in Safari'),{enableHighAccuracy:true});$('destination').addEventListener('focus',e=>{if(!e.target.value.trim())showHistory()});$('destination').addEventListener('input',e=>{selected=null;clearTimeout(searchTimer);const q=e.target.value.trim();searchTimer=setTimeout(async()=>q.length<2?showHistory():render(await geo(q)),400)});$('destination').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();buildRoute()}});</script></body></html>
