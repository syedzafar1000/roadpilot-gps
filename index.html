<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>RoadPilot GPS</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#0f172a}body{min-height:100dvh;display:grid;place-items:center;padding:20px;overflow:hidden}.phone{width:390px;height:min(800px,calc(100dvh - 40px));background:#080b10;border-radius:44px;padding:10px;box-shadow:0 30px 80px #0008;position:relative}.phone:before{content:"";position:absolute;width:115px;height:26px;background:#080b10;border-radius:20px;top:16px;left:50%;transform:translateX(-50%);z-index:1300}.screen{height:100%;border-radius:36px;overflow:hidden;position:relative;background:#fff}#map{height:100%;width:100%;position:absolute;inset:0;z-index:1}.top{position:absolute;z-index:1200;top:54px;left:12px;right:12px;display:flex;gap:8px}.search{flex:1;background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 6px 18px #0003;display:flex;gap:6px;align-items:center}.search input{border:0;outline:0;min-width:0;flex:1;font-size:14px}.btn{border:0;border-radius:12px;padding:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.gps{width:48px;background:#fff;color:#111;box-shadow:0 6px 18px #0003}.controls{position:absolute;z-index:1200;right:12px;bottom:255px;display:grid;gap:8px}.controls button{width:46px;height:46px;border:0;border-radius:14px;background:#fff;box-shadow:0 6px 18px #0003;font-size:20px;cursor:pointer}.card{position:absolute;z-index:1200;left:12px;right:12px;bottom:78px;background:#fffffff5;border-radius:22px;padding:12px;box-shadow:0 12px 30px #0004}.card h3{margin:0 0 4px;font-size:18px}.card p{margin:0;color:#64748b;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.stat{background:#f1f5f9;border-radius:12px;padding:7px;text-align:center}.stat b{display:block}.stat span{font-size:9px;color:#64748b}.start{position:absolute;z-index:1300;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));width:calc(100% - 24px);min-height:50px;font-size:16px;box-shadow:0 8px 20px #0004}.navbar{position:absolute;z-index:1250;top:112px;left:12px;right:12px;background:#111827;color:#fff;border-radius:16px;padding:12px;display:none;box-shadow:0 6px 18px #0004}.navrow{display:flex;justify-content:space-between;gap:10px;align-items:center}.navmain{font-weight:700;font-size:15px}.navsub{font-size:11px;color:#cbd5e1;margin-top:3px}.toast{position:absolute;z-index:1400;top:170px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 12px;border-radius:10px;font-size:12px;display:none}.car-wrap{width:42px;height:42px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 4px 5px #0008)}.car{font-size:32px;line-height:1;transform-origin:center center}.leaflet-control-attribution{font-size:8px!important}@media(max-width:500px){body{padding:0;display:block}.phone{width:100vw;height:100svh;border-radius:0;padding:0;box-shadow:none}.phone:before{display:none}.screen{border-radius:0}.top{top:max(12px,env(safe-area-inset-top))}.navbar{top:72px}.card{left:10px;right:10px;bottom:76px;padding:10px}.controls{right:10px;bottom:245px}.card h3{font-size:16px}.stat{padding:6px}.start{left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));width:calc(100% - 20px);min-height:52px;font-size:16px}}</style></head><body><div class="phone"><div class="screen"><div id="map"></div><div class="top"><div class="search"><span>🔎</span><input id="destination" placeholder="Enter destination"><button class="btn" id="routeBtn">Route</button></div><button class="btn gps" id="gpsBtn">📍</button></div><div id="navbar" class="navbar"><div class="navrow"><div><div id="navMain" class="navmain">Navigation started</div><div id="navSub" class="navsub">Waiting for GPS movement…</div></div><div id="speed">0 mph</div></div></div><div class="controls"><button id="zoomIn">+</button><button id="zoomOut">−</button><button id="recenter">◎</button></div><div class="card"><h3 id="title">Choose a destination</h3><p id="subtitle">Use GPS or enter a place above.</p><div class="stats"><div class="stat"><b id="distance">—</b><span>DISTANCE</span></div><div class="stat"><b id="duration">—</b><span>TIME</span></div><div class="stat"><b id="eta">—</b><span>ETA</span></div></div></div><button class="btn start" id="startBtn">Start Navigation</button><div class="toast" id="toast"></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const DEFAULT=[47.674,-122.1215];const map=L.map('map',{zoomControl:false}).setView(DEFAULT,12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);let userLoc=DEFAULT,lastLoc=null,userMarker=null,carMarker=null,destMarker=null,roadEdge=null,roadSurface=null,centerLine=null,currentRoute=null,destinationPoint=null,watchId=null,navigating=false;const $=id=>document.getElementById(id);const carIcon=L.divIcon({className:'',html:'<div class="car-wrap"><div id="carGlyph" class="car">🚗</div></div>',iconSize:[42,42],iconAnchor:[21,21]});function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}function bearing(a,b){const r=x=>x*Math.PI/180,lat1=r(a[0]),lat2=r(b[0]),dLon=r(b[1]-a[1]);const y=Math.sin(dLon)*Math.cos(lat2),x=Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);return(Math.atan2(y,x)*180/Math.PI+360)%360}function rotateCar(deg){setTimeout(()=>{const c=document.getElementById('carGlyph');if(c)c.style.transform=`rotate(${deg}deg)`},0)}function setUser(lat,lon,zoom=true,heading=null){lastLoc=userLoc;userLoc=[lat,lon];if(!userMarker)userMarker=L.circleMarker(userLoc,{radius:7,fillColor:'#2563eb',color:'#fff',weight:3,fillOpacity:1}).addTo(map);else userMarker.setLatLng(userLoc);if(!carMarker)carMarker=L.marker(userLoc,{icon:carIcon,zIndexOffset:1000}).addTo(map);else carMarker.setLatLng(userLoc);let h=heading;if((h===null||Number.isNaN(h))&&lastLoc&&Math.abs(lastLoc[0]-lat)+Math.abs(lastLoc[1]-lon)>0.000001)h=bearing(lastLoc,userLoc);if(h!==null&&!Number.isNaN(h))rotateCar(h);if(zoom)map.setView(userLoc,navigating?18:15)}setUser(...DEFAULT,false,0);$('gpsBtn').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{setUser(p.coords.latitude,p.coords.longitude,true,p.coords.heading);$('subtitle').textContent='Current location found';toast('GPS updated')},()=>toast('Allow location permission in browser'),{enableHighAccuracy:true,timeout:10000}):toast('GPS not supported');async function geocode(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));const d=await r.json();if(!d.length)throw Error('Destination not found');return{lat:+d[0].lat,lon:+d[0].lon,name:d[0].display_name}}async function getRoute(start,end){const u=`https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson&steps=true`;const r=await fetch(u),d=await r.json();if(!d.routes?.length)throw Error('No route found');return d.routes[0]}const miles=m=>(m/1609.344).toFixed(m<16093?1:0)+' mi';const mins=s=>{const m=Math.round(s/60);return m<60?m+' min':Math.floor(m/60)+'h '+m%60+'m'};const eta=s=>new Date(Date.now()+s*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});function drawRoad(route){const pts=route.geometry.coordinates.map(([lon,lat])=>[lat,lon]);if(roadEdge){roadEdge.setLatLngs(pts);roadSurface.setLatLngs(pts);centerLine.setLatLngs(pts)}else{roadEdge=L.polyline(pts,{color:'#d7d7d7',weight:22,opacity:1,lineCap:'round',lineJoin:'round'}).addTo(map);roadSurface=L.polyline(pts,{color:'#34383d',weight:18,opacity:1,lineCap:'round',lineJoin:'round'}).addTo(map);centerLine=L.polyline(pts,{color:'#f7d44a',weight:2,opacity:.95,dashArray:'12 12',lineCap:'butt'}).addTo(map)}roadEdge.bringToFront();roadSurface.bringToFront();centerLine.bringToFront();if(carMarker)carMarker.setZIndexOffset(1000)}async function buildRoute(){const q=$('destination').value.trim();if(!q)return toast('Enter a destination');$('title').textContent='Finding route...';try{const p=await geocode(q);destinationPoint=[p.lat,p.lon];const r=await getRoute(userLoc,destinationPoint);currentRoute=r;if(destMarker)destMarker.remove();destMarker=L.marker(destinationPoint).addTo(map).bindPopup(p.name);drawRoad(r);map.fitBounds(roadSurface.getBounds(),{paddingTopLeft:[45,120],paddingBottomRight:[45,260]});$('title').textContent=q;$('subtitle').textContent=p.name;$('distance').textContent=miles(r.distance);$('duration').textContent=mins(r.duration);$('eta').textContent=eta(r.duration);toast('Road ready')}catch(e){$('title').textContent='Route unavailable';$('subtitle').textContent=e.message;toast(e.message)}}function hav(a,b){const R=6371000,r=x=>x*Math.PI/180,dlat=r(b[0]-a[0]),dlon=r(b[1]-a[1]),x=Math.sin(dlat/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}async function refreshRoute(){if(!destinationPoint)return;try{const r=await getRoute(userLoc,destinationPoint);currentRoute=r;drawRoad(r);$('distance').textContent=miles(r.distance);$('duration').textContent=mins(r.duration);$('eta').textContent=eta(r.duration);const step=r.legs?.[0]?.steps?.[0];$('navMain').textContent=step?.maneuver?.instruction||step?.name||'Continue on road';$('navSub').textContent=`${miles(r.distance)} remaining • ${mins(r.duration)}`}catch(e){$('navSub').textContent='Recalculating road…'}}function startNavigation(){if(!currentRoute||!destinationPoint)return toast('Build a route first');if(!navigator.geolocation)return toast('GPS not supported');navigating=true;$('navbar').style.display='block';$('startBtn').textContent='Stop Navigation';map.setView(userLoc,18);let lastRecalc=0;watchId=navigator.geolocation.watchPosition(async p=>{setUser(p.coords.latitude,p.coords.longitude,true,p.coords.heading);$('speed').textContent=Math.max(0,Math.round((p.coords.speed||0)*2.237))+' mph';if(hav(userLoc,destinationPoint)<35){$('navMain').textContent='You have arrived';$('navSub').textContent='Destination reached';stopNavigation();return}const now=Date.now();if(now-lastRecalc>7000){lastRecalc=now;await refreshRoute()}},()=>toast('Allow precise location for navigation'),{enableHighAccuracy:true,maximumAge:1000,timeout:15000});toast('Live road navigation started')}function stopNavigation(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;navigating=false;$('navbar').style.display='none';$('startBtn').textContent='Start Navigation';toast('Navigation stopped')}$('routeBtn').onclick=buildRoute;$('destination').addEventListener('keydown',e=>e.key==='Enter'&&buildRoute());$('zoomIn').onclick=()=>map.zoomIn();$('zoomOut').onclick=()=>map.zoomOut();$('recenter').onclick=()=>map.setView(userLoc,navigating?18:15);$('startBtn').onclick=()=>navigating?stopNavigation():startNavigation();</script></body></html>
