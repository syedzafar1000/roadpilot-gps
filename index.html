<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RoadPilot GPS</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#0f172a}body{min-height:100dvh;overflow:hidden}.phone,.screen,#map{position:absolute;inset:0}.screen{overflow:hidden;background:#fff}.top{position:absolute;z-index:2100;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px}.searchwrap{flex:1;position:relative}.search{background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 6px 18px #0003;display:flex;gap:6px;align-items:center}.search input{border:0;outline:0;min-width:0;flex:1;font-size:14px}.btn{border:0;border-radius:12px;padding:10px;background:#2563eb;color:#fff;font-weight:800;touch-action:manipulation}.gps{width:48px;background:#fff;color:#111}.suggestions{position:absolute;top:54px;left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 12px 28px #0005;display:none;overflow:auto;max-height:290px;z-index:2600}.suggestion{padding:11px 12px;border-bottom:1px solid #e5e7eb}.suggestion b{display:block;font-size:13px}.suggestion span{display:block;font-size:11px;color:#64748b;margin-top:3px}.exact{color:#15803d!important;font-weight:700}.warn{color:#b45309!important;font-weight:700}.card{position:absolute;z-index:2200;left:12px;right:12px;bottom:82px;background:#fffffff3;border-radius:22px;padding:12px;box-shadow:0 12px 30px #0004}.card h3{margin:0 0 4px;font-size:18px}.card p{margin:0;color:#64748b;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.stat{background:#f1f5f9;border-radius:12px;padding:7px;text-align:center}.stat b{display:block}.stat span{font-size:9px;color:#64748b}.start{position:absolute;z-index:2800;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));width:calc(100% - 20px);min-height:58px;font-size:17px}.navbar{position:absolute;z-index:2300;top:max(12px,env(safe-area-inset-top));left:10px;right:10px;background:#101827e8;color:#fff;border-radius:18px;padding:13px 14px;display:none}.navrow{display:flex;justify-content:space-between;gap:12px;align-items:center}.navmain{font-weight:900;font-size:18px}.navsub{font-size:12px;color:#d7deea;margin-top:5px}.mode{position:absolute;z-index:2310;top:112px;right:12px;background:#0b1219e8;color:#7CFC5D;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:900;display:none}.driverInfo{position:absolute;left:12px;right:12px;bottom:120px;z-index:2250;background:#10161eea;color:#fff;border-radius:17px;padding:10px 13px;display:none}.driverInfo b{display:block;font-size:14px}.driverInfo span{font-size:11px;color:#cbd5e1}.toast{position:absolute;z-index:3000;top:170px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 12px;border-radius:10px;font-size:12px;display:none}#driverScene{position:absolute;inset:0;z-index:2000;display:none;background:linear-gradient(#74c9ff 0 35%,#93c979 35% 100%);overflow:hidden}.road{position:absolute;left:50%;bottom:-12%;transform:translateX(-50%);width:108%;height:83%;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);background:linear-gradient(90deg,#ddd 0 3%,#282b2f 3% 97%,#ddd 97%)}.road:after{content:"";position:absolute;left:49%;top:0;width:2%;height:100%;background:repeating-linear-gradient(#ffd84d 0 22px,transparent 22px 45px)}.routeRibbon{position:absolute;inset:0;width:100%;height:100%}.hood{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);width:62%;height:88px;border-radius:60% 60% 10% 10%;background:linear-gradient(#56616e,#111820)}body.nav-active .top,body.nav-active .card{display:none}body.nav-active .navbar,body.nav-active .mode,body.nav-active #driverScene,body.nav-active .driverInfo{display:block}</style></head><body><div class="phone"><div class="screen"><div id="map"></div><div id="driverScene"><div class="road"></div><svg class="routeRibbon" viewBox="0 0 390 800" preserveAspectRatio="none"><path id="routeGlow" d="M195 735 C195 610 195 520 195 420 C195 350 195 305 195 260" fill="none" stroke="#8bb2ff" stroke-width="26" opacity=".55"/><path id="routeBlue" d="M195 735 C195 610 195 520 195 420 C195 350 195 305 195 260" fill="none" stroke="#1455ff" stroke-width="15"/><polygon id="routeArrow" points="185,247 205,258 187,273" fill="white"/></svg><div class="hood"></div></div><div class="top"><div class="searchwrap"><div class="search"><span>🔎</span><input id="destination" autocomplete="off" placeholder="Enter full address"><button class="btn" id="routeBtn">Route</button></div><div id="suggestions" class="suggestions"></div></div><button class="btn gps" id="gpsBtn">📍</button></div><div id="navbar" class="navbar"><div class="navrow"><div><div id="navMain" class="navmain">Continue</div><div id="navSub" class="navsub">Navigation active</div></div><div id="speed">0 mph</div></div></div><div class="mode">🚗 DRIVER EYE</div><div class="card"><h3 id="title">Choose a destination</h3><p id="subtitle">Select an exact address suggestion.</p><div class="stats"><div class="stat"><b id="distance">—</b><span>DISTANCE</span></div><div class="stat"><b id="duration">—</b><span>TIME</span></div><div class="stat"><b id="eta">—</b><span>ETA</span></div></div></div><div class="driverInfo"><b id="driverDest">Destination</b><span id="driverRemain">—</span></div><button type="button" class="btn start" id="startBtn">Start Navigation</button><div class="toast" id="toast"></div></div></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>const DEFAULT=[-122.1215,47.674],$=id=>document.getElementById(id);const map=new maplibregl.Map({container:'map',center:DEFAULT,zoom:12,style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap'}},layers:[{id:'osm',type:'raster',source:'osm'}]}});let userLoc=[47.674,-122.1215],destinationPoint=null,currentRoute=null,watchId=null,navigating=false,selectedSuggestion=null,searchTimer=null,destMarker=null;function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2400)}function miles(m){return(m/1609.344).toFixed(1)+' mi'}function mins(s){return Math.max(1,Math.round(s/60))+' min'}function eta(s){return new Date(Date.now()+s*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}function viewbox(){const lat=userLoc[0],lon=userLoc[1],d=.18;return`${lon-d},${lat+d},${lon+d},${lat-d}`}function normalizeNominatim(x){const a=x.address||{},house=a.house_number||'',road=a.road||a.pedestrian||a.residential||a.footway||'',city=a.city||a.town||a.village||a.suburb||'',state=a.state||'',zip=a.postcode||'',line1=[house,road].filter(Boolean).join(' ')||x.name||x.display_name.split(',')[0],line2=[city,state,zip].filter(Boolean).join(', '),exact=!!(house&&road);return{lat:+x.lat,lon:+x.lon,name:x.display_name,line1,line2,exact,type:x.type}}async function nominatimSearch(q){if(!q)return[];const u=`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&dedupe=1&limit=8&countrycodes=us&viewbox=${encodeURIComponent(viewbox())}&q=${encodeURIComponent(q)}`;const d=await fetch(u).then(r=>r.json());return d.map(normalizeNominatim)}async function houseNumberSearch(q){if(!/^\d{3,6}$/.test(q))return[];const data=`[out:json][timeout:8];nwr(around:20000,${userLoc[0]},${userLoc[1]})[\"addr:housenumber\"=\"${q}\"];out center tags 30;`;const d=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(data)).then(r=>r.json());return(d.elements||[]).map(e=>{const t=e.tags||{},lat=e.lat??e.center?.lat,lon=e.lon??e.center?.lon,road=t['addr:street']||'',city=t['addr:city']||t['addr:place']||t['addr:suburb']||'',state=t['addr:state']||'Washington',zip=t['addr:postcode']||'',line1=[q,road].filter(Boolean).join(' '),line2=[city,state,zip].filter(Boolean).join(', ');return lat&&lon&&road?{lat,lon,name:[line1,line2].filter(Boolean).join(', '),line1,line2,exact:true,type:'house'}:null}).filter(Boolean)}async function autocomplete(q){if(q.length<2){$('suggestions').style.display='none';return}try{let items=/^\d{3,6}$/.test(q)?await houseNumberSearch(q):[];const more=await nominatimSearch(q),seen=new Set(items.map(x=>x.name));for(const x of more)if(!seen.has(x.name))items.push(x);renderSuggestions(items.slice(0,8))}catch(e){try{renderSuggestions(await nominatimSearch(q))}catch(_){renderSuggestions([])}}}function renderSuggestions(items){const box=$('suggestions');box.innerHTML='';if(!items.length){box.innerHTML='<div class="suggestion"><b>No exact match yet</b><span class="warn">Keep typing house number + street</span></div>';box.style.display='block';return}items.forEach(x=>{const d=document.createElement('div');d.className='suggestion';d.innerHTML=`<b>${x.line1}</b><span>${x.line2||x.name}</span><span class="${x.exact?'exact':'warn'}">${x.exact?'✓ Exact address':'Add house number for exact routing'}</span>`;d.onclick=()=>{selectedSuggestion=x;$('destination').value=x.name;box.style.display='none';if(!x.exact)toast('Add a house number for exact routing')};box.appendChild(d)});box.style.display='block'}async function getRoute(s,e){const d=await fetch(`https://router.project-osrm.org/route/v1/driving/${s[1]},${s[0]};${e[1]},${e[0]}?overview=full&geometries=geojson&steps=true`).then(r=>r.json());if(!d.routes?.length)throw Error('No route found');return d.routes[0]}function drawRoad(r){const data={type:'Feature',geometry:r.geometry,properties:{}};if(map.getSource('route'))map.getSource('route').setData(data);else{map.addSource('route',{type:'geojson',data});map.addLayer({id:'edge',type:'line',source:'route',paint:{'line-color':'#fff','line-width':30}});map.addLayer({id:'roadline',type:'line',source:'route',paint:{'line-color':'#222','line-width':24}})}}function nextStep(){const s=currentRoute?.legs?.[0]?.steps||[];return s.find(x=>x.maneuver?.type!=='depart')||s[0]}function instruction(){const s=nextStep();if(!s)return'Continue';const m=s.maneuver||{},n=s.name?' onto '+s.name:'';return m.type==='turn'?'Turn '+(m.modifier||'')+n:m.type==='roundabout'?'Enter roundabout'+n:'Continue'+n}function updateRibbon(){const mod=(nextStep()?.maneuver?.modifier||'').toLowerCase();let d='M195 735 C195 610 195 520 195 420 C195 350 195 305 195 260',p='185,247 205,258 187,273';if(mod.includes('right')){d='M195 735 C195 610 195 510 195 420 C195 345 220 300 268 260';p='260,247 282,258 264,273'}else if(mod.includes('left')){d='M195 735 C195 610 195 510 195 420 C195 345 170 300 122 260';p='130,247 108,258 126,273'}$('routeGlow').setAttribute('d',d);$('routeBlue').setAttribute('d',d);$('routeArrow').setAttribute('points',p)}async function buildRoute(){const q=$('destination').value.trim();if(!q)return toast('Enter a destination');$('suggestions').style.display='none';try{let p=selectedSuggestion&&$('destination').value===selectedSuggestion.name?selectedSuggestion:null;if(!p){const results=await nominatimSearch(q);p=results.find(x=>x.exact)||results[0]}if(!p)throw Error('Address not found');if(!p.exact){selectedSuggestion=p;renderSuggestions([p]);throw Error('Please enter the house number for exact routing')}destinationPoint=[p.lat,p.lon];if(destMarker)destMarker.remove();destMarker=new maplibregl.Marker({color:'#dc2626'}).setLngLat([p.lon,p.lat]).addTo(map);currentRoute=await getRoute(userLoc,destinationPoint);drawRoad(currentRoute);const c=currentRoute.geometry.coordinates,b=c.reduce((bb,x)=>bb.extend(x),new maplibregl.LngLatBounds(c[0],c[0]));map.fitBounds(b,{padding:80,maxZoom:16});$('title').textContent=p.line1;$('subtitle').textContent=p.name;$('distance').textContent=miles(currentRoute.distance);$('duration').textContent=mins(currentRoute.duration);$('eta').textContent=eta(currentRoute.duration);$('driverDest').textContent=p.line1;toast('Exact address locked ✓')}catch(e){toast(e.message)}}async function refresh(){try{currentRoute=await getRoute(userLoc,destinationPoint);$('navMain').textContent=instruction();$('navSub').textContent=`${miles(currentRoute.distance)} remaining • ${mins(currentRoute.duration)}`;$('driverRemain').textContent=`${miles(currentRoute.distance)} remaining • ETA ${eta(currentRoute.duration)}`;updateRibbon()}catch(e){$('navSub').textContent='Route active • GPS reconnecting'}}function startNavigation(){if(!currentRoute||!destinationPoint)return toast('Build an exact route first');navigating=true;document.body.classList.add('nav-active');$('startBtn').textContent='End Trip';$('navMain').textContent=instruction();$('navSub').textContent=`${miles(currentRoute.distance)} remaining • ${mins(currentRoute.duration)}`;$('driverRemain').textContent=`${miles(currentRoute.distance)} remaining • ETA ${eta(currentRoute.duration)}`;updateRibbon();if(navigator.geolocation){let last=0;watchId=navigator.geolocation.watchPosition(async p=>{userLoc=[p.coords.latitude,p.coords.longitude];$('speed').textContent=Math.max(0,Math.round((p.coords.speed||0)*2.237))+' mph';if(Date.now()-last>7000){last=Date.now();await refresh()}},()=>toast('Navigation active — allow GPS for live updates'),{enableHighAccuracy:true,maximumAge:2000,timeout:20000})}toast('Navigation started')}function stopNavigation(){if(watchId!==null&&navigator.geolocation)navigator.geolocation.clearWatch(watchId);watchId=null;navigating=false;document.body.classList.remove('nav-active');$('startBtn').textContent='Start Navigation'}$('gpsBtn').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{userLoc=[p.coords.latitude,p.coords.longitude];map.easeTo({center:[p.coords.longitude,p.coords.latitude],zoom:15});toast('GPS location updated')},()=>toast('Please allow location in Safari'),{enableHighAccuracy:true}):toast('GPS unavailable');$('routeBtn').onclick=buildRoute;$('destination').addEventListener('input',e=>{selectedSuggestion=null;clearTimeout(searchTimer);searchTimer=setTimeout(()=>autocomplete(e.target.value.trim()),500)});$('destination').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();buildRoute()}});$('startBtn').onclick=()=>navigating?stopNavigation():startNavigation();</script></body></html>
