<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>RoadPilot GPS</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><link rel="stylesheet" href="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#08111f}body{overflow:hidden;min-height:100dvh}.screen,#map{position:absolute;inset:0}.top{position:absolute;z-index:2200;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px}.searchwrap{position:relative;flex:1}.search{display:flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 7px 22px #0005}.search input{border:0;outline:0;min-width:0;flex:1;font-size:14px}.btn{border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:800;padding:10px;touch-action:manipulation}.gps{width:48px;background:#fff;color:#111}.historyBtn{width:42px;background:#eef2ff;color:#1d4ed8}.suggestions{position:absolute;top:54px;left:0;right:0;display:none;max-height:330px;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 12px 28px #0005;z-index:3100}.suggestion{padding:11px 12px;border-bottom:1px solid #e5e7eb}.suggestion b{display:block;font-size:13px}.suggestion span{display:block;margin-top:3px;font-size:11px;color:#64748b}.exact{color:#15803d!important;font-weight:700}.warn{color:#b45309!important;font-weight:700}.recent{color:#2563eb!important;font-weight:700}.card{position:absolute;z-index:2200;left:12px;right:12px;bottom:82px;background:#fffffff3;border-radius:20px;padding:12px;box-shadow:0 12px 30px #0004}.card h3{margin:0 0 4px;font-size:18px}.card p{margin:0;color:#64748b;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.stat{background:#f1f5f9;border-radius:12px;padding:7px;text-align:center}.stat b{display:block}.stat span{font-size:9px;color:#64748b}.start{position:absolute;z-index:2900;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));width:calc(100% - 20px);min-height:58px;font-size:17px}.toast{position:absolute;z-index:5000;left:50%;top:115px;transform:translateX(-50%);display:none;max-width:88%;background:#111827ee;color:#fff;padding:9px 13px;border-radius:12px;font-size:12px;font-weight:700;text-align:center}.driver{position:absolute;inset:0;z-index:4000;display:none;background:#000;isolation:isolate}.mly{position:absolute;inset:0;z-index:1!important;background:#000;display:block!important}.mly>div,.mly canvas,.mly .mapillary-container{width:100%!important;height:100%!important;z-index:1!important}.shade{position:absolute;inset:0;z-index:20;pointer-events:none;background:linear-gradient(#0005 0 15%,transparent 28% 76%,#0007 100%)}.turnPanel{position:absolute;z-index:90;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;background:linear-gradient(135deg,#075f32f5,#0b7f46f5);color:#fff;border:1px solid #62e58c88;border-radius:19px;padding:12px 14px;box-shadow:0 10px 28px #0008}.turnRow{display:flex;align-items:center;gap:12px}.turnIcon{width:58px;text-align:center;font-size:42px;line-height:1}.turnText{flex:1}.turnDistance{font-size:13px;font-weight:800;color:#a7ffc0}.turnStreet{font-size:21px;font-weight:900;line-height:1.08}.speed{font-size:15px;font-weight:800}.mode{position:absolute;z-index:90;right:12px;top:112px;background:#0d1725e8;color:#8fffb0;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:900}.build{position:absolute;z-index:90;left:12px;top:112px;background:#062c1dee;color:#8fffb0;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900}.routePerspective{position:absolute;inset:0;z-index:60;pointer-events:none;transform:none!important;opacity:.84!important}.routeRibbon{fill:url(#routeGradient);stroke:#9affc7;stroke-width:1.6;opacity:.78}.routeEdge{fill:none;stroke:#d2ffe3;stroke-width:1.6;opacity:.92}.chevron{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.94}.driverInfo{position:absolute;z-index:80;left:12px;right:12px;bottom:92px;background:#10161ef2;color:#fff;border:1px solid #ffffff18;border-radius:18px;padding:11px 14px;box-shadow:0 8px 22px #0006}.driverInfo b{display:block;font-size:14px}.driverInfo span{font-size:11px;color:#cbd5e1}.streetStatus{position:absolute;z-index:70;left:50%;top:50%;transform:translate(-50%,-50%);background:#111827dd;color:#fff;padding:10px 13px;border-radius:12px;font-size:12px;font-weight:800;display:none;max-width:78%;text-align:center}body.nav-active #map{visibility:hidden!important}body.nav-active .top,body.nav-active .card{display:none}body.nav-active .driver{display:block}</style></head><body><div class="screen"><div id="map"></div><div id="driver" class="driver"><div id="mly" class="mly"></div><div class="shade"></div><div class="turnPanel"><div class="turnRow"><div id="turnIcon" class="turnIcon">↑</div><div class="turnText"><div id="turnDistance" class="turnDistance">Continue</div><div id="turnStreet" class="turnStreet">Follow route</div></div><div id="speed" class="speed">0 mph</div></div></div><div class="build">DRIVER EYE STREET v7</div><div class="mode">📷 REAL STREET VIEW</div><div id="streetStatus" class="streetStatus">Loading real street imagery…</div><svg id="routeOverlay" class="routePerspective" viewBox="0 0 390 844" preserveAspectRatio="none"><defs><linearGradient id="routeGradient" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#087a4f"/><stop offset=".58" stop-color="#13a56d"/><stop offset="1" stop-color="#63e7aa"/></linearGradient></defs><polygon class="routeRibbon" points="149,844 241,844 207,330 183,330"/><polyline class="routeEdge" points="149,844 183,330"/><polyline class="routeEdge" points="241,844 207,330"/><g><polyline class="chevron" points="164,735 195,714 226,735"/><polyline class="chevron" points="171,648 195,631 219,648"/><polyline class="chevron" points="176,573 195,559 214,573"/><polyline class="chevron" points="181,508 195,497 209,508"/><polyline class="chevron" points="185,453 195,445 205,453"/><polyline class="chevron" points="188,414 195,408 202,414"/><polyline class="chevron" points="190,378 195,373 200,378"/></g></svg><div class="driverInfo"><b id="driverDest">Destination</b><span id="driverRemain">—</span></div></div><div class="top"><div class="searchwrap"><div class="search"><span>🔎</span><input id="destination" autocomplete="off" placeholder="Enter full address"><button id="historyBtn" class="btn historyBtn" type="button">🕘</button><button id="routeBtn" class="btn" type="button">Route</button></div><div id="suggestions" class="suggestions"></div></div><button id="gpsBtn" class="btn gps" type="button">📍</button></div><div class="card"><h3 id="title">Choose a destination</h3><p id="subtitle">Select an exact address.</p><div class="stats"><div class="stat"><b id="distance">—</b><span>DISTANCE</span></div><div class="stat"><b id="duration">—</b><span>TIME</span></div><div class="stat"><b id="eta">—</b><span>ETA</span></div></div></div><button id="startBtn" class="btn start" type="button">Start Navigation</button><div id="appToast" class="toast"></div></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script src="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js"></script><script>const $=id=>document.getElementById(id),DEFAULT=[47.674,-122.1215];let userLoc=[...DEFAULT],roadLoc=[...DEFAULT],dest=null,roadDest=null,route=null,selected=null,watchId=null,navigating=false,mly=null,searchTimer=null,lastStreetLoc=null,lastImageId=null,lastRouteRefresh=0,lastImageRefresh=0;const map=new maplibregl.Map({container:'map',center:[DEFAULT[1],DEFAULT[0]],zoom:12,style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256}},layers:[{id:'osm',type:'raster',source:'osm'}]}});function toast(t){const e=$('appToast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2300)}function streetStatus(t,on=true){const e=$('streetStatus');e.textContent=t;e.style.display=on?'block':'none'}function miles(m){return(m/1609.344).toFixed(1)+' mi'}function mins(s){return Math.max(1,Math.round(s/60))+' min'}function eta(s){return new Date(Date.now()+s*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}function dist(a,b){const R=6371000,p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,dp=(b[0]-a[0])*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180,q=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function bearing(a,b){const p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180,y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return(Math.atan2(y,x)*180/Math.PI+360)%360}function angleDiff(a,b){return Math.abs(((a-b+540)%360)-180)}function history(){try{const a=JSON.parse(localStorage.getItem('roadpilot_history')||'[]'),b=JSON.parse(localStorage.getItem('roadpilot_address_history')||'[]'),seen=new Set();return[...a,...b].filter(x=>x&&x.name&&!seen.has(x.name)&&seen.add(x.name)).slice(0,15)}catch{return[]}}function saveHistory(p){const c={name:p.name,line1:p.line1,line2:p.line2,lat:p.lat,lon:p.lon,exact:true};let h=history().filter(x=>x.name!==c.name);h.unshift(c);localStorage.setItem('roadpilot_history',JSON.stringify(h.slice(0,15)));localStorage.setItem('roadpilot_address_history',JSON.stringify(h.slice(0,15)))}function showHistory(){const h=history(),b=$('suggestions');b.innerHTML='';if(!h.length){b.innerHTML='<div class="suggestion"><b>No recent destinations yet</b><span>Addresses appear here after you build a route.</span></div>';b.style.display='block';return}h.forEach(x=>{const d=document.createElement('div');d.className='suggestion';d.innerHTML=`<b>🕘 ${x.line1||x.name}</b><span>${x.line2||x.name}</span><span class="recent">Recent destination</span>`;d.onclick=()=>{selected=x;$('destination').value=x.name;b.style.display='none'};b.appendChild(d)});b.style.display='block'}function token(){let t=localStorage.getItem('roadpilot_mapillary_token');if(t)return t;t=prompt('Paste your Mapillary Access Token once.');if(t){t=t.trim();localStorage.setItem('roadpilot_mapillary_token',t)}return t||''}function ensureViewer(){if(mly)return mly;const t=token();if(!t)throw Error('Mapillary token needed');const c=$('mly');c.style.display='block';mly=new mapillary.Viewer({accessToken:t,container:c,component:{sequence:{visible:false}}});mly.on('image',e=>{lastImageId=e?.image?.id||lastImageId;streetStatus('',false)});return mly}function getFreshGPS(){return new Promise(resolve=>{if(!navigator.geolocation)return resolve(false);navigator.geolocation.getCurrentPosition(p=>{userLoc=[p.coords.latitude,p.coords.longitude];resolve(true)},()=>resolve(false),{enableHighAccuracy:true,maximumAge:0,timeout:12000})})}async function snapToRoad(loc){try{const u=`https://router.project-osrm.org/nearest/v1/driving/${loc[1]},${loc[0]}?number=1`;const d=await fetch(u,{cache:'no-store'}).then(r=>r.json());const w=d.waypoints?.[0];if(!w?.location)return loc;const s=[w.location[1],w.location[0]];return dist(loc,s)<=100?s:loc}catch{return loc}}async function geo(q){const d=.18,v=`${userLoc[1]-d},${userLoc[0]+d},${userLoc[1]+d},${userLoc[0]-d}`,u=`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&countrycodes=us&viewbox=${encodeURIComponent(v)}&q=${encodeURIComponent(q)}`;const a=await fetch(u).then(r=>r.json());return a.map(x=>{const z=x.address||{},house=z.house_number||'',road=z.road||z.residential||z.pedestrian||'',city=z.city||z.town||z.village||z.suburb||'',state=z.state||'',zip=z.postcode||'',line1=[house,road].filter(Boolean).join(' ')||x.display_name.split(',')[0],line2=[city,state,zip].filter(Boolean).join(', ');return{lat:+x.lat,lon:+x.lon,name:x.display_name,line1,line2,exact:!!(house&&road)}})}function render(items){const b=$('suggestions');b.innerHTML='';items.forEach(x=>{const d=document.createElement('div');d.className='suggestion';d.innerHTML=`<b>${x.line1}</b><span>${x.line2||x.name}</span><span class="${x.exact?'exact':'warn'}">${x.exact?'✓ Exact address':'Add house number for exact routing'}</span>`;d.onclick=()=>{selected=x;$('destination').value=x.name;b.style.display='none'};b.appendChild(d)});b.style.display=items.length?'block':'none'}async function getRoute(s,e){const u=`https://router.project-osrm.org/route/v1/driving/${s[1]},${s[0]};${e[1]},${e[0]}?overview=full&geometries=geojson&steps=true`;const d=await fetch(u,{cache:'no-store'}).then(r=>r.json());if(!d.routes?.length)throw Error('No route found');return d.routes[0]}function coords(){return route?.geometry?.coordinates||[]}function nearestIndex(loc=roadLoc){let bi=0,bd=Infinity;coords().forEach((c,i)=>{const x=dist(loc,[c[1],c[0]]);if(x<bd){bd=x;bi=i}});return bi}function routeHeadingAt(loc=roadLoc){const c=coords();if(c.length<2)return null;const i=nearestIndex(loc),j=Math.min(c.length-1,i+Math.max(2,Math.floor(c.length/120)));return i===j?null:bearing([c[i][1],c[i][0]],[c[j][1],c[j][0]])}function stepInfo(r=route){const s=r?.legs?.[0]?.steps||[],x=s.find(v=>v.maneuver?.type!=='depart'&&v.distance>8)||s[0];if(!x)return{icon:'↑',street:'Continue',distance:''};const m=x.maneuver||{},mod=(m.modifier||'').toLowerCase(),icon=mod.includes('right')?'↱':mod.includes('left')?'↰':mod.includes('uturn')?'↶':'↑',ft=x.distance*3.28084,label=ft<1000?`${Math.max(25,Math.round(ft/25)*25)} ft`:`${(ft/5280).toFixed(1)} mi`;return{icon,street:x.name||'Continue',distance:label}}function updateGuidance(r=route){const i=stepInfo(r);$('turnIcon').textContent=i.icon;$('turnStreet').textContent=i.street;$('turnDistance').textContent=i.distance?`In ${i.distance}`:'Continue';if(r)$('driverRemain').textContent=`${miles(r.distance)} remaining • ETA ${eta(r.duration)}`}async function findStreetImage(){const t=token();if(!t)throw Error('Mapillary token needed');const lat=userLoc[0],lon=userLoc[1],d=.004,bbox=`${lon-d},${lat-d},${lon+d},${lat+d}`,u=`https://graph.mapillary.com/images?access_token=${encodeURIComponent(t)}&fields=id,computed_geometry,compass_angle&bbox=${bbox}&limit=100`;const data=await fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Street imagery unavailable');return r.json()}),imgs=(data.data||[]).filter(x=>x.computed_geometry?.coordinates),desired=routeHeadingAt();if(!imgs.length)throw Error('No Mapillary street imagery near your GPS position');imgs.forEach(x=>{const A=x.computed_geometry.coordinates,dm=dist(userLoc,[A[1],A[0]]),ad=desired!=null&&Number.isFinite(+x.compass_angle)?angleDiff(+x.compass_angle,desired):90;x._score=dm+ad*5});imgs.sort((a,b)=>a._score-b._score);return imgs[0]}async function showStreet(force=false){if(!navigating)return;if(!force&&lastStreetLoc&&dist(lastStreetLoc,userLoc)<35)return;if(!force&&Date.now()-lastImageRefresh<4500)return;lastImageRefresh=Date.now();try{streetStatus('Loading real street imagery…',!lastImageId);const v=ensureViewer();await new Promise(r=>setTimeout(r,120));try{v.resize()}catch{}const img=await findStreetImage();if(force||img.id!==lastImageId)await v.moveTo(img.id);const rh=routeHeadingAt();if(rh!=null&&typeof v.setBearing==='function'){try{await v.setBearing(rh)}catch{}}if(typeof v.setFieldOfView==='function'){try{await v.setFieldOfView(78)}catch{}}lastStreetLoc=[...userLoc];streetStatus('',false)}catch(e){streetStatus(lastImageId?'':'Street imagery unavailable here',!lastImageId);toast(e.message)}}async function refreshRoute(force=false){if(!dest||!navigating)return;if(!force&&Date.now()-lastRouteRefresh<3500)return;lastRouteRefresh=Date.now();roadLoc=await snapToRoad(userLoc);try{route=await getRoute(roadLoc,roadDest||dest);updateGuidance(route);if(route.distance<45||dist(userLoc,dest)<35){$('turnIcon').textContent='✓';$('turnDistance').textContent='Arriving';$('turnStreet').textContent=$('driverDest').textContent}showStreet()}catch{toast('Recalculating route…')}}async function buildRoute(){const q=$('destination').value.trim();if(!q)return toast('Enter a destination');try{toast('Getting current GPS…');await getFreshGPS();roadLoc=await snapToRoad(userLoc);let p=selected&&$('destination').value===selected.name?selected:null;if(!p){const r=await geo(q);p=r.find(x=>x.exact)||r[0]}if(!p)throw Error('Address not found');if(!p.exact)throw Error('Enter house number for exact routing');dest=[p.lat,p.lon];roadDest=await snapToRoad(dest);route=await getRoute(roadLoc,roadDest);selected=p;saveHistory(p);const c=coords(),b=c.reduce((bb,x)=>bb.extend(x),new maplibregl.LngLatBounds(c[0],c[0]));map.fitBounds(b,{padding:80,maxZoom:16});$('title').textContent=p.line1;$('subtitle').textContent=p.name;$('distance').textContent=miles(route.distance);$('duration').textContent=mins(route.duration);$('eta').textContent=eta(route.duration);$('driverDest').textContent=p.line1;toast('Route ready')}catch(e){toast(e.message)}}async function start(){if(!route||!dest)return toast('Build a route first');await getFreshGPS();roadLoc=await snapToRoad(userLoc);try{route=await getRoute(roadLoc,roadDest||dest)}catch{}navigating=true;lastStreetLoc=null;lastRouteRefresh=0;lastImageRefresh=0;document.body.classList.add('nav-active');$('startBtn').textContent='End Trip';updateGuidance(route);streetStatus('Loading real street imagery…',true);setTimeout(async()=>{try{const v=ensureViewer();try{v.resize()}catch{}await showStreet(true)}catch(e){streetStatus('Street imagery unavailable here',true);toast(e.message)}},350);if(navigator.geolocation)watchId=navigator.geolocation.watchPosition(async p=>{if(Number.isFinite(p.coords.accuracy)&&p.coords.accuracy>80)return;userLoc=[p.coords.latitude,p.coords.longitude];$('speed').textContent=Math.max(0,Math.round((p.coords.speed||0)*2.237))+' mph';await refreshRoute()},()=>toast('Allow GPS for live navigation'),{enableHighAccuracy:true,maximumAge:500,timeout:20000})}function stop(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;navigating=false;document.body.classList.remove('nav-active');$('startBtn').textContent='Start Navigation';streetStatus('',false)}$('routeBtn').onclick=buildRoute;$('startBtn').onclick=()=>navigating?stop():start();$('historyBtn').onclick=showHistory;$('gpsBtn').onclick=()=>navigator.geolocation?.getCurrentPosition(async p=>{userLoc=[p.coords.latitude,p.coords.longitude];roadLoc=await snapToRoad(userLoc);map.easeTo({center:[roadLoc[1],roadLoc[0]],zoom:16});toast('GPS updated')},()=>toast('Allow location in Safari'),{enableHighAccuracy:true});$('destination').addEventListener('focus',e=>{if(!e.target.value.trim())showHistory()});$('destination').addEventListener('input',e=>{selected=null;clearTimeout(searchTimer);const q=e.target.value.trim();searchTimer=setTimeout(async()=>q.length<2?showHistory():render(await geo(q)),400)});$('destination').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();buildRoute()}});</script></body></html>
