<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>RoadPilot GPS</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;min-height:100vh;display:grid;place-items:center;padding:20px}.phone{width:390px;height:800px;background:#080b10;border-radius:44px;padding:10px;box-shadow:0 30px 80px #0008;position:relative}.phone:before{content:"";position:absolute;width:115px;height:26px;background:#080b10;border-radius:20px;top:16px;left:50%;transform:translateX(-50%);z-index:1300}.screen{height:100%;border-radius:36px;overflow:hidden;position:relative;background:#fff}#map{height:100%;width:100%;position:absolute;inset:0;z-index:1}.top{position:absolute;z-index:1200;top:54px;left:12px;right:12px;display:flex;gap:8px}.search{flex:1;background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 6px 18px #0003;display:flex;gap:6px;align-items:center}.search input{border:0;outline:0;min-width:0;flex:1;font-size:14px}.btn{border:0;border-radius:12px;padding:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.gps{width:48px;background:#fff;color:#111;box-shadow:0 6px 18px #0003}.controls{position:absolute;z-index:1200;right:12px;bottom:185px;display:grid;gap:8px}.controls button{width:46px;height:46px;border:0;border-radius:14px;background:#fff;box-shadow:0 6px 18px #0003;font-size:20px;cursor:pointer}.card{position:absolute;z-index:1200;left:12px;right:12px;bottom:18px;background:#fffffff5;border-radius:22px;padding:14px;box-shadow:0 12px 30px #0004}.card h3{margin:0 0 4px}.card p{margin:0;color:#64748b;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{background:#f1f5f9;border-radius:12px;padding:8px;text-align:center}.stat b{display:block}.stat span{font-size:9px;color:#64748b}.start{width:100%;margin-top:10px}.navbar{position:absolute;z-index:1250;top:112px;left:12px;right:12px;background:#111827;color:#fff;border-radius:16px;padding:12px;display:none;box-shadow:0 6px 18px #0004}.navrow{display:flex;justify-content:space-between;gap:10px;align-items:center}.navmain{font-weight:700;font-size:15px}.navsub{font-size:11px;color:#cbd5e1;margin-top:3px}.toast{position:absolute;z-index:1400;top:170px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 12px;border-radius:10px;font-size:12px;display:none}@media(max-width:500px){body{padding:0}.phone{width:100vw;height:100vh;border-radius:0;padding:0}.screen{border-radius:0}}</style></head><body><div class="phone"><div class="screen"><div id="map"></div><div class="top"><div class="search"><span>🔎</span><input id="destination" placeholder="Enter destination"><button class="btn" id="routeBtn">Route</button></div><button class="btn gps" id="gpsBtn">📍</button></div><div id="navbar" class="navbar"><div class="navrow"><div><div id="navMain" class="navmain">Navigation started</div><div id="navSub" class="navsub">Waiting for GPS movement…</div></div><div id="speed">0 mph</div></div></div><div class="controls"><button id="zoomIn">+</button><button id="zoomOut">−</button><button id="recenter">◎</button></div><div class="card"><h3 id="title">Choose a destination</h3><p id="subtitle">Use GPS or enter a place above.</p><div class="stats"><div class="stat"><b id="distance">—</b><span>DISTANCE</span></div><div class="stat"><b id="duration">—</b><span>TIME</span></div><div class="stat"><b id="eta">—</b><span>ETA</span></div></div><button class="btn start" id="startBtn">Start Navigation</button></div><div class="toast" id="toast"></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const DEFAULT=[47.674,-122.1215];const map=L.map('map',{zoomControl:false}).setView(DEFAULT,12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);let userLoc=DEFAULT,userMarker=null,destMarker=null,routeLine=null,currentRoute=null,destinationPoint=null,watchId=null,navigating=false;const $=id=>document.getElementById(id);function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}function setUser(lat,lon,zoom=true){userLoc=[lat,lon];if(userMarker)userMarker.setLatLng(userLoc);else userMarker=L.circleMarker(userLoc,{radius:9,fillColor:'#2563eb',color:'#fff',weight:4,fillOpacity:1}).addTo(map);if(zoom)map.setView(userLoc,navigating?17:15)}setUser(...DEFAULT,false);$('gpsBtn').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{setUser(p.coords.latitude,p.coords.longitude,true);$('subtitle').textContent='Current location found';toast('GPS updated')},()=>toast('Allow location permission in browser'),{enableHighAccuracy:true,timeout:10000}):toast('GPS not supported');async function geocode(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));const d=await r.json();if(!d.length)throw Error('Destination not found');return{lat:+d[0].lat,lon:+d[0].lon,name:d[0].display_name}}async function getRoute(start,end){const u=`https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson&steps=true`;const r=await fetch(u),d=await r.json();if(!d.routes?.length)throw Error('No route found');return d.routes[0]}const miles=m=>(m/1609.344).toFixed(m<16093?1:0)+' mi';const mins=s=>{const m=Math.round(s/60);return m<60?m+' min':Math.floor(m/60)+'h '+m%60+'m'};const eta=s=>new Date(Date.now()+s*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});async function buildRoute(){const q=$('destination').value.trim();if(!q)return toast('Enter a destination');$('title').textContent='Finding route...';try{const p=await geocode(q);destinationPoint=[p.lat,p.lon];const r=await getRoute(userLoc,destinationPoint);currentRoute=r;if(destMarker)destMarker.remove();destMarker=L.marker(destinationPoint).addTo(map).bindPopup(p.name);if(routeLine)routeLine.remove();routeLine=L.polyline(r.geometry.coordinates.map(([lon,lat])=>[lat,lon]),{weight:7,opacity:.85}).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[45,45]});$('title').textContent=q;$('subtitle').textContent=p.name;$('distance').textContent=miles(r.distance);$('duration').textContent=mins(r.duration);$('eta').textContent=eta(r.duration);toast('Route ready')}catch(e){$('title').textContent='Route unavailable';$('subtitle').textContent=e.message;toast(e.message)}}function hav(a,b){const R=6371000,r=x=>x*Math.PI/180,dlat=r(b[0]-a[0]),dlon=r(b[1]-a[1]),x=Math.sin(dlat/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}async function refreshRoute(){if(!destinationPoint)return;try{const r=await getRoute(userLoc,destinationPoint);currentRoute=r;if(routeLine)routeLine.setLatLngs(r.geometry.coordinates.map(([lon,lat])=>[lat,lon]));$('distance').textContent=miles(r.distance);$('duration').textContent=mins(r.duration);$('eta').textContent=eta(r.duration);const step=r.legs?.[0]?.steps?.[0];$('navMain').textContent=step?.maneuver?.instruction||step?.name||'Continue on route';$('navSub').textContent=`${miles(r.distance)} remaining • ${mins(r.duration)}`}catch(e){$('navSub').textContent='Recalculating route…'}}function startNavigation(){if(!currentRoute||!destinationPoint)return toast('Build a route first');if(!navigator.geolocation)return toast('GPS not supported');navigating=true;$('navbar').style.display='block';$('startBtn').textContent='Stop Navigation';map.setView(userLoc,17);let lastRecalc=0;watchId=navigator.geolocation.watchPosition(async p=>{setUser(p.coords.latitude,p.coords.longitude,true);$('speed').textContent=Math.max(0,Math.round((p.coords.speed||0)*2.237))+' mph';if(hav(userLoc,destinationPoint)<35){$('navMain').textContent='You have arrived';$('navSub').textContent='Destination reached';stopNavigation();return}const now=Date.now();if(now-lastRecalc>7000){lastRecalc=now;await refreshRoute()}},()=>toast('Allow precise location for navigation'),{enableHighAccuracy:true,maximumAge:1000,timeout:15000});toast('Live navigation started')}function stopNavigation(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;navigating=false;$('navbar').style.display='none';$('startBtn').textContent='Start Navigation';toast('Navigation stopped')}$('routeBtn').onclick=buildRoute;$('destination').addEventListener('keydown',e=>e.key==='Enter'&&buildRoute());$('zoomIn').onclick=()=>map.zoomIn();$('zoomOut').onclick=()=>map.zoomOut();$('recenter').onclick=()=>map.setView(userLoc,navigating?17:15);$('startBtn').onclick=()=>navigating?stopNavigation():startNavigation();</script></body></html>
