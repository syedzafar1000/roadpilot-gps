<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RoadPilot GPS</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><link rel="stylesheet" href="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#0b1020}body{min-height:100dvh;overflow:hidden}.screen,#map{position:absolute;inset:0}.screen{overflow:hidden}.top{position:absolute;z-index:2200;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px}.searchwrap{flex:1;position:relative}.search{display:flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 6px 20px #0004}.search input{border:0;outline:0;flex:1;min-width:0;font-size:14px}.btn{border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:800;padding:10px;touch-action:manipulation}.gps{width:48px;background:#fff;color:#111}.suggestions{position:absolute;top:54px;left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 12px 28px #0005;max-height:320px;overflow:auto;display:none}.suggestion{padding:11px 12px;border-bottom:1px solid #e5e7eb}.suggestion b{display:block;font-size:13px}.suggestion span{display:block;font-size:11px;color:#64748b;margin-top:3px}.recent{color:#2563eb!important;font-weight:700}.card{position:absolute;z-index:2200;left:12px;right:12px;bottom:82px;background:#fffffff3;border-radius:20px;padding:12px;box-shadow:0 12px 30px #0004}.card h3{margin:0 0 4px;font-size:18px}.card p{margin:0;color:#64748b;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.stat{background:#f1f5f9;border-radius:12px;padding:7px;text-align:center}.stat b{display:block}.stat span{font-size:9px;color:#64748b}.start{position:absolute;z-index:2900;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));width:calc(100% - 20px);min-height:58px;font-size:17px}.driver{position:absolute;inset:0;z-index:2000;background:#111;display:none}.mly{position:absolute;inset:0}.shade{position:absolute;inset:0;z-index:2050;pointer-events:none;background:linear-gradient(#0005 0 17%,transparent 32% 70%,#0008 100%)}.turnPanel{position:absolute;z-index:2600;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;background:#087b34eF;color:white;border-radius:18px;padding:13px 14px;box-shadow:0 8px 26px #0007}.turnRow{display:flex;align-items:center;gap:12px}.turnIcon{font-size:42px;line-height:1;width:56px;text-align:center}.turnText{flex:1}.turnDistance{font-size:13px;font-weight:800;opacity:.95}.turnStreet{font-size:21px;font-weight:900;line-height:1.1}.speed{font-size:15px;font-weight:800}.routePerspective{position:absolute;inset:0;z-index:2350;pointer-events:none}.routeGlow{fill:none;stroke:#79a9ff;stroke-width:34;opacity:.36;stroke-linecap:round}.routeLine{fill:none;stroke:#1976ff;stroke-width:22;opacity:.9;stroke-linecap:round}.routeArrow{fill:#fff}.mode{position:absolute;z-index:2600;right:12px;top:112px;background:#0d1725e8;color:#7CFC5D;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:900}.driverInfo{position:absolute;z-index:2500;left:12px;right:12px;bottom:112px;background:#10161eea;color:#fff;border-radius:17px;padding:10px 13px}.driverInfo b{display:block;font-size:14px}.driverInfo span{font-size:11px;color:#cbd5e1}.seqControls{position:absolute;z-index:2750;left:50%;transform:translateX(-50%);bottom:230px;display:flex;gap:18px}.seqBtn{width:72px;height:58px;border:2px solid #ffffffdd;border-radius:18px;background:#101827ee;color:#fff;font-size:30px;font-weight:900;box-shadow:0 8px 22px #0008}.status{position:absolute;z-index:2800;left:50%;top:50%;transform:translate(-50%,-50%);background:#101827e8;color:#fff;padding:11px 14px;border-radius:13px;font-size:12px;font-weight:800;display:none}.hood{position:absolute;z-index:2300;pointer-events:none;left:50%;bottom:52px;transform:translateX(-50%);width:60%;height:82px;border-radius:60% 60% 10% 10%;background:linear-gradient(#536171aa,#111820dd)}body.nav-active .top,body.nav-active .card{display:none}body.nav-active .driver{display:block}</style></head><body><div class="screen"><div id="map"></div><div id="driver" class="driver"><div id="mly" class="mly"></div><div class="shade"></div><div class="turnPanel"><div class="turnRow"><div id="turnIcon" class="turnIcon">↑</div><div class="turnText"><div id="turnDistance" class="turnDistance">Continue</div><div id="turnStreet" class="turnStreet">Follow route</div></div><div id="speed" class="speed">0 mph</div></div></div><div class="mode">📷 ROAD VIEW</div><svg class="routePerspective" viewBox="0 0 390 844" preserveAspectRatio="none"><path id="routeGlow" class="routeGlow" d="M195 810 C195 700 195 600 195 500 C195 425 195 370 195 315"/><path id="routeLine" class="routeLine" d="M195 810 C195 700 195 600 195 500 C195 425 195 370 195 315"/><polygon id="routeArrow" class="routeArrow" points="184,305 207,315 185,330"/></svg><div id="status" class="status">Loading street view…</div><div class="seqControls"><button id="prevStreet" class="seqBtn">◀</button><button id="nextStreet" class="seqBtn">▶</button></div><div class="driverInfo"><b id="driverDest">Destination</b><span id="driverRemain">—</span></div><div class="hood"></div></div><div class="top"><div class="searchwrap"><div class="search"><span>🔎</span><input id="destination" autocomplete="off" placeholder="Enter full address"><button id="routeBtn" class="btn">Route</button></div><div id="suggestions" class="suggestions"></div></div><button id="gpsBtn" class="btn gps">📍</button></div><div class="card"><h3 id="title">Choose a destination</h3><p id="subtitle">Select an exact address.</p><div class="stats"><div class="stat"><b id="distance">—</b><span>DISTANCE</span></div><div class="stat"><b id="duration">—</b><span>TIME</span></div><div class="stat"><b id="eta">—</b><span>ETA</span></div></div></div><button id="startBtn" class="btn start">Start Navigation</button></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script src="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js"></script><script>const $=id=>document.getElementById(id),DEFAULT=[47.674,-122.1215];let userLoc=[...DEFAULT],dest=null,route=null,selected=null,watchId=null,navigating=false,mly=null,routeIndex=0,manual=false,lastImageId=null,searchTimer=null;const map=new maplibregl.Map({container:'map',center:[DEFAULT[1],DEFAULT[0]],zoom:12,style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256}},layers:[{id:'osm',type:'raster',source:'osm'}]}});function toast(t){const e=$('status');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1800)}function miles(m){return(m/1609.344).toFixed(1)+' mi'}function mins(s){return Math.max(1,Math.round(s/60))+' min'}function eta(s){return new Date(Date.now()+s*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}function dist(a,b){const R=6371000,p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,dp=(b[0]-a[0])*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180,q=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function history(){try{return JSON.parse(localStorage.getItem('roadpilot_history')||'[]')}catch{return[]}}function saveHistory(p){let h=history().filter(x=>x.name!==p.name);h.unshift(p);localStorage.setItem('roadpilot_history',JSON.stringify(h.slice(0,10)))}function showHistory(){const h=history(),b=$('suggestions');if(!h.length)return;b.innerHTML='';h.forEach(x=>{const d=document.createElement('div');d.className='suggestion';d.innerHTML=`<b>🕘 ${x.line1}</b><span>${x.line2||x.name}</span><span class="recent">Recent destination</span>`;d.onclick=()=>{selected=x;$('destination').value=x.name;b.style.display='none'};b.appendChild(d)});b.style.display='block'}function token(){let t=localStorage.getItem('roadpilot_mapillary_token');if(t)return t;t=prompt('Paste your Mapillary Access Token once.');if(t){t=t.trim();localStorage.setItem('roadpilot_mapillary_token',t)}return t||''}function ensureViewer(){if(mly)return mly;const t=token();if(!t)return null;mly=new mapillary.Viewer({accessToken:t,container:'mly',component:{sequence:{visible:true}}});mly.on('image',e=>{$('status').style.display='none';lastImageId=e?.image?.id||lastImageId});return mly}async function geo(q){const d=.18,v=`${userLoc[1]-d},${userLoc[0]+d},${userLoc[1]+d},${userLoc[0]-d}`,u=`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&countrycodes=us&viewbox=${encodeURIComponent(v)}&q=${encodeURIComponent(q)}`;const a=await fetch(u).then(r=>r.json());return a.map(x=>{const z=x.address||{},house=z.house_number||'',road=z.road||z.residential||z.pedestrian||'',city=z.city||z.town||z.village||z.suburb||'',state=z.state||'',zip=z.postcode||'',line1=[house,road].filter(Boolean).join(' ')||x.display_name.split(',')[0],line2=[city,state,zip].filter(Boolean).join(', ');return{lat:+x.lat,lon:+x.lon,name:x.display_name,line1,line2,exact:!!(house&&road)}})}function render(items){const b=$('suggestions');b.innerHTML='';items.forEach(x=>{const d=document.createElement('div');d.className='suggestion';d.innerHTML=`<b>${x.line1}</b><span>${x.line2||x.name}</span><span>${x.exact?'✓ Exact address':'Add house number for exact routing'}</span>`;d.onclick=()=>{selected=x;$('destination').value=x.name;b.style.display='none'};b.appendChild(d)});b.style.display=items.length?'block':'none'}async function getRoute(s,e){const u=`https://router.project-osrm.org/route/v1/driving/${s[1]},${s[0]};${e[1]},${e[0]}?overview=full&geometries=geojson&steps=true`;const d=await fetch(u).then(r=>r.json());if(!d.routes?.length)throw Error('No route found');return d.routes[0]}function coords(){return route?.geometry?.coordinates||[]}function nearestIndex(loc){let bi=0,bd=1e99;coords().forEach((c,i)=>{const d=dist(loc,[c[1],c[0]]);if(d<bd){bd=d;bi=i}});return bi}function stepInfo(r=route){const s=r?.legs?.[0]?.steps||[],x=s.find(v=>v.maneuver?.type!=='depart')||s[0];if(!x)return{icon:'↑',street:'Continue',distance:''};const m=x.maneuver||{},mod=(m.modifier||'').toLowerCase(),icon=mod.includes('right')?'↱':mod.includes('left')?'↰':mod.includes('uturn')?'↶':'↑';return{icon,street:x.name||'Continue',distance:x.distance?`${Math.max(50,Math.round(x.distance*3.28084/50)*50)} ft`:'' ,mod}}function updatePerspective(info){let d='M195 810 C195 700 195 600 195 500 C195 425 195 370 195 315',p='184,305 207,315 185,330';if(info.mod?.includes('right')){d='M195 810 C195 700 195 600 195 500 C195 420 218 360 286 315';p='276,301 302,315 278,332'}else if(info.mod?.includes('left')){d='M195 810 C195 700 195 600 195 500 C195 420 172 360 104 315';p='114,301 88,315 112,332'}$('routeGlow').setAttribute('d',d);$('routeLine').setAttribute('d',d);$('routeArrow').setAttribute('points',p)}function updateGuidance(r=route){const i=stepInfo(r);$('turnIcon').textContent=i.icon;$('turnStreet').textContent=i.street;$('turnDistance').textContent=i.distance?`In ${i.distance}`:'Continue';updatePerspective(i);if(r){$('driverRemain').textContent=`${miles(r.distance)} remaining • ETA ${eta(r.duration)}`}}async function findStreetImage(){const t=token();if(!t)throw Error('Mapillary token needed');const lat=userLoc[0],lon=userLoc[1],d=.0022,bbox=`${lon-d},${lat-d},${lon+d},${lat+d}`,u=`https://graph.mapillary.com/images?access_token=${encodeURIComponent(t)}&fields=id,computed_geometry,compass_angle&bbox=${bbox}&limit=100`;const data=await fetch(u).then(r=>r.json()),imgs=(data.data||[]).filter(x=>x.computed_geometry?.coordinates);if(!imgs.length)throw Error('No street imagery near this route point');imgs.sort((a,b)=>{const A=a.computed_geometry.coordinates,B=b.computed_geometry.coordinates;return dist(userLoc,[A[1],A[0]])-dist(userLoc,[B[1],B[0]])});return imgs[0].id}async function syncStreet(){if(!navigating)return;try{toast('Loading route street…');const v=ensureViewer(),id=await findStreetImage();if(v&&id!==lastImageId){await v.moveTo(id);lastImageId=id}else $('status').style.display='none'}catch(e){toast(e.message)}}async function previewUpdate(){if(!dest)return;try{const r=await getRoute(userLoc,dest);updateGuidance(r)}catch{}}function jump(dir){const c=coords();if(!c.length)return;manual=true;const step=Math.max(3,Math.floor(c.length/48));routeIndex=Math.max(0,Math.min(c.length-1,routeIndex+(dir==='next'?step:-step)));userLoc=[c[routeIndex][1],c[routeIndex][0]];previewUpdate();syncStreet();if(routeIndex>=c.length-2)toast('Destination reached')}async function buildRoute(){const q=$('destination').value.trim();if(!q)return toast('Enter a destination');try{let p=selected&&$('destination').value===selected.name?selected:null;if(!p){const r=await geo(q);p=r.find(x=>x.exact)||r[0]}if(!p)throw Error('Address not found');if(!p.exact)throw Error('Enter house number for exact routing');dest=[p.lat,p.lon];route=await getRoute(userLoc,dest);routeIndex=nearestIndex(userLoc);selected=p;saveHistory(p);const c=coords(),b=c.reduce((bb,x)=>bb.extend(x),new maplibregl.LngLatBounds(c[0],c[0]));map.fitBounds(b,{padding:80,maxZoom:16});$('title').textContent=p.line1;$('subtitle').textContent=p.name;$('distance').textContent=miles(route.distance);$('duration').textContent=mins(route.duration);$('eta').textContent=eta(route.duration);$('driverDest').textContent=p.line1;toast('Route ready')}catch(e){toast(e.message)}}function start(){if(!route||!dest)return toast('Build a route first');navigating=true;manual=false;routeIndex=nearestIndex(userLoc);document.body.classList.add('nav-active');$('startBtn').textContent='End Trip';updateGuidance(route);syncStreet();if(navigator.geolocation)watchId=navigator.geolocation.watchPosition(async p=>{if(!manual){userLoc=[p.coords.latitude,p.coords.longitude];routeIndex=nearestIndex(userLoc)}$('speed').textContent=Math.max(0,Math.round((p.coords.speed||0)*2.237))+' mph';if(!manual){try{route=await getRoute(userLoc,dest);updateGuidance(route);syncStreet()}catch{}}},()=>toast('Allow GPS for live navigation'),{enableHighAccuracy:true,maximumAge:3000,timeout:20000})}function stop(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;navigating=false;manual=false;document.body.classList.remove('nav-active');$('startBtn').textContent='Start Navigation'}$('routeBtn').onclick=buildRoute;$('startBtn').onclick=()=>navigating?stop():start();$('nextStreet').onclick=()=>jump('next');$('prevStreet').onclick=()=>jump('prev');$('gpsBtn').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{userLoc=[p.coords.latitude,p.coords.longitude];map.easeTo({center:[userLoc[1],userLoc[0]],zoom:15});toast('GPS updated')},()=>toast('Allow location in Safari'),{enableHighAccuracy:true});$('destination').addEventListener('focus',e=>{if(!e.target.value.trim())showHistory()});$('destination').addEventListener('input',e=>{selected=null;clearTimeout(searchTimer);const q=e.target.value.trim();searchTimer=setTimeout(async()=>q.length<2?showHistory():render(await geo(q)),400)});$('destination').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();buildRoute()}});</script></body></html>
